<script>
  // 글꼴을 직접 받아서(받은 양을 % 로 보여 주며) 다 받으면 화면을 보여 줌 → 기본 글꼴이 먼저 보였다가 바뀌지 않음
  // 두 번째부터는 서비스워커가 폰에 저장해 둔 글꼴을 바로 꺼내 줌. 10초가 넘으면 기본 글꼴로 먼저 보여 주고, 다 받으면 바뀜
  document.documentElement.classList.add("fonts-wait");
  (function () {
    var FONTS = [
      { family: "Hippie", url: "https://cdn.jsdelivr.net/gh/Project-Noonnu/2610081905@hippie/hippie/hippie_%ED%9E%88%ED%94%BC%EC%B2%B4.woff2", size: 4114752, got: 0 },
      { family: "WatermelonYang", url: "https://cdn.jsdelivr.net/gh/projectnoonnu/2408-4@1.0/RixXladywatermelonR.woff2", size: 602188, got: 0 }
    ];
    var done = false, fontsDone = false;
    function reveal() { if (done || !fontsDone || !window.__rendered) return; done = true; document.documentElement.classList.remove("fonts-wait"); }
    function finish() { fontsDone = true; reveal(); }
    window.__reveal = reveal;
    function show() {
      var total = 0, got = 0;
      FONTS.forEach(function (f) { total += f.size; got += Math.min(f.got, f.size); });
      var el = document.getElementById("loading-pct");
      var pct = Math.min(99, Math.floor(got / total * 100));
      if (el) el.textContent = pct + "%";
      var bar = document.getElementById("loading-fill");
      if (bar) bar.style.width = pct + "%";
    }
    function load(f) {
      return fetch(f.url, { mode: "cors" }).then(function (res) {
        if (!res.ok) throw new Error("font");
        var len = +res.headers.get("content-length"); if (len) f.size = len;
        if (!res.body || !res.body.getReader) return res.arrayBuffer().then(function (buf) { f.got = f.size; show(); return buf; });
        var reader = res.body.getReader(), parts = [], n = 0;
        return (function pump() {
          return reader.read().then(function (r) {
            if (r.done) {
              var out = new Uint8Array(n), o = 0;
              parts.forEach(function (p) { out.set(p, o); o += p.length; });
              return out.buffer;
            }
            parts.push(r.value); n += r.value.length; f.got = n; show();
            return pump();
          });
        })();
      }).then(function (buf) {
        var face = new FontFace(f.family, buf);
        return face.load().then(function () { document.fonts.add(face); });
      });
    }
    setTimeout(function () { finish(); window.__rendered = true; reveal(); }, 10000);
    if (!window.fetch || !window.FontFace) { finish(); return; }
    Promise.all(FONTS.map(load)).then(finish, finish);
  })();
</script>
<style>

#loading{display:none}
#loading-pct{margin-left:.4em;font-variant-numeric:tabular-nums}
html{background:#FCFCFC}

/* 폰트: 제목 히피체, 내용 WatermelonYang (눈누) — 위 스크립트가 받아서 등록 */

  --period:#DA5552;    /* 생리 */
  --plan:#5D576B;      /* 생리 예정일 */
  --fertile:#FEC0AA;   /* 가임기 */
  --ovul:#F2C94C;      /* 알낳는날 노란 타원 (임시, 나중에 손그림) */
  --sex:#CA7DF9;       /* 관계 하트 */
  --shave:#B7B5B3;     /* 제모 수풀 */

}

/* 첫 화면 */

<script>
"use strict";
/* ---------- 화면에 나오는 말 (둘만의 용어로 바꿀 땐 여기만) ----------
   알림 문구는 worker/src/index.js 의 MESSAGES */
const T = {
  period: "쥐구멍", periodOn: "쥐구멍 속", periodPlan: "쥐구멍 앞", periodDay: "쥐구멍 입장",
  fertile: "꿀렁", ovulation: "알낳는날", sex: "쥐잡", shave: "털갈이", anniv: "기념일", master: "주인",
  slave: "쥐"             // 파트너(캘린더를 보는 쪽)
};

/* ---------- 오늘의 쥐: 시기별 사진 · 단계 · 설명 (문구는 여기만 고치면 돼요. 해결책은 TODO) ---------- */
const PHASES = {
  rage:  { img: "img/phase-rage.jpg",  title: "광기의 쥐",
           desc: `${T.periodDay} 일주일 전. 사소한 일에도 화가 나고 다 뿌셔버리고 싶은 단계예요.`, },
  blue:  { img: "img/phase-blue.jpg",  title: "우울한 쥐",
           desc: `${T.periodDay} 3일 전. 기운이 없고 마음이 가라앉는 단계예요.`, },
  small: { img: "img/phase-small.jpg", pos: "50% 15%", title: "아주 작은 쥐",
           desc: `${T.periodOn}. 몸도 마음도 아주 약해지는 단계예요.`, },
  calm:  { img: "img/phase-calm.jpg",  title: "평온한 쥐",
           desc: "아주 평온한 단계예요.", }
};

/* ---------- 설정값 ----------
   MASTER_HASH: 마스터 암호를 되돌릴 수 없게 바꾼 값 (암호 원문은 코드에 없음). 암호를 바꾸려면 이 값을 새로 계산해서 교체
   DAY_ONE: 사귄 날 (1일)
   MODEL: 주기 예측 하이퍼파라미터. 개인 정보(나이·키·몸무게)는 저장소에 두지 않고, 그걸 반영한 값만 둠 */
const MASTER_HASH = "1ad87b9bb25a6a7dc968d84eda86d50e0282c0ef63a3a804643e38ca1cc01699";
const DAY_ONE = new Date(2023, 8, 2);
const MODEL = {
  // 2024.3~2026.10 실제 기록 30주기로 과거 재현 테스트해서 고른 값 (2026-11-10)
  // 결과: 다음 생리일 평균 오차 1.82일 → 1.71일, 예정 범위 폭 8.2일 → 6.0일 (실제 시작일이 범위 안에 든 비율 82%)
  priorMean: 32,      // 기록이 적을 때 쓰는 주기 평균(일). 실제 평균 31.9일
  priorStrength: 4,   // 위 값을 "몇 주기 분량"만큼 믿을지. 기록이 쌓일수록 개인 값이 우선
  priorSd: 2,         // 주기마다 흔들리는 정도(표준편차, 일) 사전값. 실제 2.2일
  sdStrength: 1,
  halfLife: 20,       // 최근 주기 비중: 20주기 전 기록은 비중 절반 (주기가 안정적이라 긴 기록을 고르게 쓰는 게 더 정확)
  skipRatio: 1.6,     // 평소의 1.6배를 넘는 간격은 기록을 빠뜨린 달로 보고 제외
  luteal: 12.4,       // 배란 → 다음 생리까지(일). Bull et al. 2019 평균. 배란테스트로 개인 값을 알면 교체
  periodLen: 5,       // 생리 기간(일) 기본값. 정상 범위 3~8일(FIGO)의 대표값. 매일 기록한 달이 생기면 그 평균이 우선
  rangeZ: 1.15        // 예측 범위 넓이. 실제 기록에서 약 80%가 범위 안에 들도록 맞춤
};

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const sum = a => a.reduce((x, y) => x + y, 0);
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
const isHoliday = d => d.getDay() === 0 || !!(window.HOLIDAYS && window.HOLIDAYS.has(keyOf(d)));

// 기념일: 1일 = DAY_ONE. 100일 단위 + 매년 같은 날(n주년)
function annivOf(d) {
  const n = diffDays(DAY_ONE, d) + 1;
  if (n <= 1) return null;
  const years = d.getFullYear() - DAY_ONE.getFullYear();
  if (years > 0 && d.getMonth() === DAY_ONE.getMonth() && d.getDate() === DAY_ONE.getDate()) return `${years}주년`;
  if (n % 100 === 0) return `${n}일`;
  return null;
}

/* ---------- 저장 (이 기기 안) ---------- */
// ?profile=slave : 디버깅용. 같은 브라우저에서 슬레이브 화면을 따로 띄움 (저장 공간 분리)
const PROFILE = new URLSearchParams(location.search).get("profile") === "slave" ? "slave" : null;
const MASTER_KEY = "calendar-v1";
const STORAGE_KEY = PROFILE ? "calendar-v1:slave" : MASTER_KEY;
// ?master : 이 기기를 마스터 암호 화면으로 (슬레이브로 바뀐 기기를 되돌릴 때)
const FORCE_GATE = !PROFILE && new URLSearchParams(location.search).has("master");
const SHOW_ALL = { period: true, plan: true, fertile: true, ovul: true, sex: true, shave: true, anniv: true };
const isRed = l => !!(l && l.r);

function cleanLogs(raw) {
  const out = {};
  for (const [k, v] of Object.entries(raw && typeof raw === "object" ? raw : {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v) continue;
    const l = { r: v.r === true, h: v.h === true, s: v.s === true };
    if (l.r || l.h || l.s) out[k] = l;
  }
  return out;
}
function cleanShow(raw) {
  const out = {};
  for (const k of Object.keys(SHOW_ALL)) out[k] = !(raw && raw[k] === false);
  return out;
}
let oldShareId = null;
function load() {
  // mode: "me"(마스터) | "partner"(슬레이브) | null(첫 화면)
  // myShare: 마스터가 올리는 공유 {id, key, salt, question, fp} / partnerLink: 슬레이브가 보는 공유 {id, key}
  const base = { mode: null, logs: {}, meta: {}, metaAt: {}, vault: null, show: { ...SHOW_ALL }, partner: null, myShare: null, partnerLink: null };
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!p) return base;
    const d = { ...base, ...p, logs: cleanLogs(p.logs), show: cleanShow(p.show) };
    if (d.partner) d.partner = { ...d.partner, logs: cleanLogs(d.partner.logs), show: cleanShow(d.partner.show) };
    // 예전 방식(질문 없는 링크) 공유는 정리
    if (d.myShare && !d.myShare.salt) { oldShareId = d.myShare.id; d.myShare = null; }
    return d;
  } catch { return base; }
}
let data = load(), engine, partnerEngine;
if (PROFILE === "slave") {
  // 이 브라우저의 마스터가 공유 중이면 그 공유에 자동 연결
  try {
    const m = JSON.parse(localStorage.getItem(MASTER_KEY) || "null");
    if (m && m.myShare && m.myShare.salt && (!data.partnerLink || data.partnerLink.id !== m.myShare.id)) {

function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} }

const stamp = f => { data.metaAt = { ...(data.metaAt || {}), [f]: Date.now() }; };

/* ---------- 주기 예측 ----------
   개인 기록 + 사전값을 섞는 베이지안 방식 (Li et al. 2021, SkipTrack 2025의 아이디어를 한 사람용으로 단순화)
   - 최근 주기에 더 큰 비중, 기록을 빠뜨린 달은 제외
   - 다음 생리 = 마지막 시작일 + 개인 평균 주기, 예측 범위 = 80% 구간 (먼 달일수록 넓어짐)
   - 배란일 = 다음 생리 − 황체기(12.4일, Bull et al. 2019), 가임기 = 배란일 5일 전 ~ 1일 후 */
function makeEngine(logs, now = today()) {
  const dates = Object.keys(logs).filter(k => isRed(logs[k])).sort().map(dateOf);
  const runs = [];
  for (const d of dates) {
    const last = runs[runs.length - 1];
    if (last && diffDays(last.end, d) <= 2) last.end = d; else runs.push({ start: d, end: d });
  }
  let gaps = runs.slice(1).map((r, i) => diffDays(runs[i].start, r.start)).filter(g => g >= 15 && g <= 90);
  if (gaps.length >= 3) { const m = median(gaps); gaps = gaps.filter(g => g <= m * MODEL.skipRatio); }

  const n = gaps.length, w = gaps.map((_, i) => Math.pow(0.5, (n - 1 - i) / MODEL.halfLife));
  const W = sum(w), ybar = W ? sum(gaps.map((g, i) => g * w[i])) / W : 0;
  const k0 = MODEL.priorStrength, nu0 = MODEL.sdStrength, m0 = MODEL.priorMean;
  const mu = (k0 * m0 + W * ybar) / (k0 + W);
  const ss = sum(gaps.map((g, i) => w[i] * (g - ybar) ** 2));
  const s2 = (nu0 * MODEL.priorSd ** 2 + ss + (W ? k0 * W / (k0 + W) * (ybar - m0) ** 2 : 0)) / (nu0 + W);
  const df = nu0 + W, z = MODEL.rangeZ;
  const sd = Math.sqrt(s2 * (1 + 1 / (k0 + W)));
  const q = z + (z ** 3 + z) / (4 * df); // t 분포 분위수 근사

  // 생리 기간: 이틀 이상 이어서 기록한 달만 실제 기간으로 봄 (시작일만 찍은 달은 기간 정보가 없음)
  const done = runs.filter(r => r.end > r.start && diffDays(r.end, now) >= 2).slice(-6).map(r => diffDays(r.start, r.end) + 1);
  const len = Math.max(1, Math.min(10, Math.round((MODEL.periodLen * 2 + sum(done)) / (2 + done.length))));
  // 시작일만 기록한 달은 위 기간만큼 생리로 채워서 보여줌 (저장된 기록은 그대로)
  const inferred = new Set();
  runs.forEach(r => { if (diffDays(r.start, r.end) === 0) for (let j = 1; j < len; j++) inferred.add(keyOf(addDays(r.start, j))); });
  runs.forEach(r => { if (diffDays(r.start, r.end) === 0) r.end = addDays(r.start, len - 1); });

  const plan = new Set(), maybe = new Set(), fertile = new Set(), ovul = new Set(), starts = [], mids = [];
  const lut = Math.round(MODEL.luteal);
  runs.slice(1).forEach((r, i) => { const g = diffDays(runs[i].start, r.start); if (g >= 15 && g <= 60) mids.push(addDays(r.start, -lut)); });
  if (runs.length) {
    const last = runs[runs.length - 1];
    const first = addDays(last.start, Math.round(mu));
    const late = first < now && now > last.end ? diffDays(first, now) : 0; // 예정일이 지났으면 오늘부터로 밀기
    for (let k = 1; k <= 6; k++) {
      const c = addDays(last.start, Math.round(mu * k) + late);
      const half = Math.max(1, Math.round(q * sd * Math.sqrt(k)));
      starts.push(c);
      for (let j = 0; j < len; j++) plan.add(keyOf(addDays(c, j)));
      for (let j = -half; j <= half + len - 1; j++) { const d = addDays(c, j); if (d > last.end && d >= now) maybe.add(keyOf(d)); }
      mids.push(addDays(c, -lut));
    }
  }
  plan.forEach(k => maybe.delete(k));
  mids.sort((a, b) => a - b);
  mids.forEach(o => { ovul.add(keyOf(o)); for (let j = -5; j <= 1; j++) fertile.add(keyOf(addDays(o, j))); });
  return { runs, mu, sd, len, inferred, plan, maybe, fertile, ovul, starts, mids };
}

/* ---------- 실시간 공유 (Firebase) ----------
   서버에는 폰에서 암호화한 데이터만 올라감.
   열쇠 = 마스터가 정한 "답"으로 만든 값 → 링크만 있어서는 못 열고, 답을 알아야 열림 */
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const Cloud = {

  load() {

  async uid() {

  async get(id) { const { fs, db } = await this.load(); const s = await fs.getDoc(fs.doc(db, "shares", id)); return s.exists() ? s.data() : null; },
  async remove(id) { const { fs, db } = await this.load(); await this.uid(); await fs.deleteDoc(fs.doc(db, "shares", id)); },
  async watch(id, onData, onError) {

    return fs.onSnapshot(fs.doc(db, "shares", id), s => onData(s.exists() ? s.data() : null), onError);

const b64url = bytes => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)));

const Crypt = {
  key: k => crypto.subtle.importKey("raw", unb64url(k), "AES-GCM", false, ["encrypt", "decrypt"]),
  // 답 → 열쇠 (일부러 느리게 만들어 답을 하나씩 대입해 보기 어렵게)
  async fromAnswer(answer, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(answer)), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64url(salt), iterations: 310000 }, base, 256);
    return b64url(new Uint8Array(bits));
  },
  async encrypt(k, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(k), new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64url(iv), ct: b64url(new Uint8Array(ct)) };
  },
  async decrypt(k, { iv, ct }) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64url(iv) }, await this.key(k), unb64url(ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

// 슬레이브 초대 링크: #j=공유ID.소금값.질문
const joinLink = () => data.myShare &&
  `${location.origin}${location.pathname}#j=${data.myShare.id}.${data.myShare.salt}.${b64url(new TextEncoder().encode(data.myShare.question))}`;
function parseJoin(text) {
  const m = String(text || "").match(/#j=([A-Za-z0-9_-]{10,})\.([A-Za-z0-9_-]{16,})\.([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try { return { id: m[1], salt: m[2], question: new TextDecoder().decode(unb64url(m[3])) }; } catch { return null; }
}

// 슬레이브에게 보내는 내용: 보여주기로 한 것만 (생리 기록은 예측 계산에 필요해서 항상 포함)
function snapshot() {
  const show = data.show, logs = {};
  for (const [k, v] of Object.entries(data.logs)) {
    const l = { r: v.r, h: show.sex && v.h, s: show.shave && v.s };
    if (l.r || l.h || l.s) logs[k] = l;
  }
  return { format: "cal", version: 2, exportedAt: isoNow(), logs, show,

}
const shareFp = () => JSON.stringify([data.logs, data.show, data.notify && data.notify.claimed ? data.notify.id : null, data.vault && data.vault.id]);
const sync = { timer: null, unsub: null, live: false, gone: false, error: "" };

function scheduleSync(delay = 800) {
  if (!data.myShare || !Cloud.configured) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushShare, delay);
}
async function pushShare() {
  const share = data.myShare; if (!share) return;
  const fp = shareFp();
  if (fp === share.fp) return;
  try {
    await Cloud.put(share.id, await Crypt.encrypt(share.key, snapshot()), share.owner);
    share.fp = fp; sync.error = ""; persist();
  } catch (e) {
    sync.error = e.code === "permission-denied" ? "이 기기에서 공유를 수정할 수 없어요. 연결을 새로 만들어 주세요." : "인터넷 연결 후 자동으로 올려요.";
  }
  refresh();
}
async function createShare(question, answer) {
  const id = randId(15), salt = randId(16), key = await Crypt.fromAnswer(answer, salt);
  if (NOTIFY) await ensureChannel().catch(() => {});
  const owner = await Cloud.uid();
  await Cloud.put(id, await Crypt.encrypt(key, snapshot()), owner);
  data.myShare = { id, salt, key, question, owner, fp: shareFp() };
  stamp("share"); save();
}
async function stopShare() {
  if (data.myShare) { try { await Cloud.remove(data.myShare.id); } catch {} }
  data.myShare = null; data.pendingNotify = false; stamp("share"); save();
  await rotateChannel(); // 한 마스터당 한 슬레이브: 예전 슬레이브의 알림도 끊음
}

/* ---------- 마스터 동기화 · 자동 백업 (Firebase vaults) ----------
   마스터 기록 전체를 이 기기에서 암호화해 서버에 올림 → 여러 마스터 기기가 같은 캘린더를 씀, 쥐 연결과 무관하게 남음
   - 날짜별로 마지막으로 바꾼 시각(meta)을 기록해서, 기기끼리 다르면 더 최근 것을 씀
   - 시각이 같거나 없으면(예전 기록) 있는 쪽을 남김 → 애매할 때 지우지 않음 */
const vaultSync = { timer: null, unsub: null, ok: false, error: "", devices: 0, lastFp: "", creating: false };
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
const SAFETY_KEY = STORAGE_KEY + ":safety";
function safetyCopy(tag) {
  // 처음 동기화하기 전 기록을 이 기기에 따로 한 번 보관 (만일을 위해)
  try { if (!localStorage.getItem(SAFETY_KEY)) localStorage.setItem(SAFETY_KEY, JSON.stringify({ at: isoNow(), tag, logs: data.logs })); } catch {}
}
function vaultPayload() {
  const s = data.myShare, n = data.notify;
  return { v: 1, logs: data.logs, meta: data.meta || {}, show: data.show,
    share: s ? { id: s.id, salt: s.salt, key: s.key, question: s.question, owner: s.owner || null } : null,
    notify: n ? { id: n.id, token: n.token, claimed: !!n.claimed } : null,
    at: data.metaAt || {} };
}
function mergeRemote(r) {
  if (!r || typeof r !== "object") return false;
  const before = canon(vaultPayload());
  const ll = data.logs, rl = cleanLogs(r.logs), lm = data.meta || {}, rm = r.meta && typeof r.meta === "object" ? r.meta : {};
  const logs = {}, meta = {};
  for (const k of new Set([...Object.keys(ll), ...Object.keys(rl), ...Object.keys(lm), ...Object.keys(rm)])) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const tl = +lm[k] || 0, tr = +rm[k] || 0;
    const v = tr > tl ? rl[k] : tl > tr ? ll[k] : (ll[k] || rl[k]);
    if (v) logs[k] = v;

  const la = { ...(data.metaAt || {}) }, ra = r.at && typeof r.at === "object" ? r.at : {};
  const pick = (f, lv, rv, apply) => {
    const tl = +la[f] || 0, tr = +ra[f] || 0;
    if (tr > tl || (tr === tl && lv == null && rv != null)) { apply(rv); if (tr) la[f] = tr; }
  };
  pick("show", data.show, r.show, v => { data.show = cleanShow(v); });
  pick("share", data.myShare, r.share, s => {
    if (!s) data.myShare = null;
    else if (!data.myShare || data.myShare.id !== s.id)
      data.myShare = { id: s.id, salt: s.salt, key: s.key, question: String(s.question || ""), owner: s.owner || null, fp: null };
    else if (!data.myShare.owner) data.myShare.owner = s.owner || null;
  });
  pick("notify", data.notify, r.notify, n => {
    if (!n) data.notify = null;
    else if (!data.notify || data.notify.id !== n.id) data.notify = { id: n.id, token: n.token, claimed: !!n.claimed };
  });

}
function scheduleVault(delay = 1200) {
  if (!data.vault || data.mode !== "me" || PROFILE || !Cloud.configured) return;
  clearTimeout(vaultSync.timer);
  vaultSync.timer = setTimeout(pushVault, delay);
}
async function pushVault() {
  if (!data.vault || canon(vaultPayload()) === vaultSync.lastFp) return;
  try {
    const { fs, db } = await Cloud.load(); await Cloud.uid();
    const ref = fs.doc(db, "vaults", data.vault.id);
    await fs.runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("gone");
      mergeRemote(await Crypt.decrypt(data.vault.key, snap.data()));
      tx.update(ref, { ...(await Crypt.encrypt(data.vault.key, vaultPayload())), updatedAt: fs.serverTimestamp() });
    });

    persist(); rebuild(); scheduleSync(0);
  } catch (e) {
    vaultSync.error = e.code === "permission-denied" ? "이 기기는 백업에 등록되어 있지 않아요." : "인터넷 연결 후 자동으로 백업해요.";
  }

async function ensureVault() {

    const { fs, db } = await Cloud.load(); const uid = await Cloud.uid();
    if (data.myShare && !data.myShare.owner) data.myShare.owner = uid; // 지금 공유를 만든 기기 = 이 기기
    const id = randId(15), key = randId(32);
    await fs.setDoc(fs.doc(db, "vaults", id), { devices: [uid], pairHash: "", v: 1, ...(await Crypt.encrypt(key, vaultPayload())), updatedAt: fs.serverTimestamp() });
    data.vault = { id, key }; persist();
    vaultSync.lastFp = canon(vaultPayload()); vaultSync.error = "";
    scheduleSync(0); watchVault();
  } catch { vaultSync.error = "백업을 만들지 못했어요. 인터넷 연결 후 다시 시도해요."; }
  vaultSync.creating = false; refresh();
}
async function watchVault() {
  if (vaultSync.unsub || !data.vault || data.mode !== "me" || PROFILE || !Cloud.configured) return;
  try {
    const { fs, db } = await Cloud.load(); await Cloud.uid();
    const vid = data.vault.id;
    vaultSync.unsub = fs.onSnapshot(fs.doc(db, "vaults", vid), async snap => {
      if (!data.vault || data.vault.id !== vid) return;
      if (!snap.exists()) { vaultSync.ok = false; vaultSync.error = "백업을 찾을 수 없어요."; refresh(); return; }
      const d = snap.data(); vaultSync.devices = (d.devices || []).length;

        if (changed) { persist(); rebuild(); scheduleSync(0); scheduleReminders(0); }
        vaultSync.lastFp = canon(remote);
        if (canon(vaultPayload()) !== vaultSync.lastFp) scheduleVault(); // 이 기기에 더 최근 기록이 있으면 올림
      } catch { vaultSync.error = "백업을 열지 못했어요."; }
      refresh();
    }, err => { vaultSync.ok = false; vaultSync.error = err.code === "permission-denied" ? "이 기기는 백업에 등록되어 있지 않아요." : ""; refresh(); });
  } catch {}
}
// 기기 추가 링크: #m=묶음ID.열쇠.일회용토큰
async function makeDeviceLink() {
  await ensureVault();
  if (!data.vault) throw new Error("no-vault");
  const token = randId(24);
  const { fs, db } = await Cloud.load(); await Cloud.uid();
  await fs.updateDoc(fs.doc(db, "vaults", data.vault.id), { pairHash: await sha256hex(token), updatedAt: fs.serverTimestamp() });
  return `${location.origin}${location.pathname}#m=${data.vault.id}.${data.vault.key}.${token}`;
}
function parseDevice(text) {
  const m = String(text || "").match(/#m=([A-Za-z0-9_-]{10,})\.([A-Za-z0-9_-]{40,})\.([A-Za-z0-9_-]{20,})/);
  return m && { id: m[1], key: m[2], token: m[3] };
}
async function joinDevice(link) {
  const { fs, db } = await Cloud.load(); const uid = await Cloud.uid();
  const ref = fs.doc(db, "vaults", link.id);
  try { await fs.updateDoc(ref, { devices: fs.arrayUnion(uid), pair: link.token }); } catch {} // 이미 등록된 기기면 실패해도 괜찮음

  if (!snap.exists()) throw new Error("gone");

  try { remote = await Crypt.decrypt(link.key, snap.data()); } catch { throw new Error("key"); }
  safetyCopy("before-join");
  if (data.mode === "partner") { if (sync.unsub) { sync.unsub(); sync.unsub = null; } data.partnerLink = null; data.partner = null; }
  if (vaultSync.unsub) { vaultSync.unsub(); vaultSync.unsub = null; }
  data.mode = "me"; data.vault = { id: link.id, key: link.key };
  mergeRemote(remote); persist(); rebuild();
  vaultSync.lastFp = canon(remote);
  fs.updateDoc(ref, { pairHash: await sha256hex(randId(24)), updatedAt: fs.serverTimestamp() }).catch(() => {}); // 링크 재사용 막기
  watchVault(); scheduleVault(0); catchUp();
}

async function watchPartner() {
  if (sync.unsub) { sync.unsub(); sync.unsub = null; }
  sync.live = false; sync.gone = false;
  const link = data.partnerLink;
  if (!link || !Cloud.configured) return;
  try {
    sync.unsub = await Cloud.watch(link.id, async doc => {
      if (!doc) { sync.gone = true; refresh(); return; }
      try {
        const snap = await Crypt.decrypt(link.key, doc);
        data.partner = { exportedAt: String(snap.exportedAt || ""), logs: cleanLogs(snap.logs), show: cleanShow(snap.show),
                         notifyId: typeof snap.notifyId === "string" && /^[A-Za-z0-9_-]{16,64}$/.test(snap.notifyId) ? snap.notifyId : null };
        sync.live = true; sync.gone = false; sync.error = ""; persist(); rebuild();
      } catch { sync.error = "데이터를 열지 못했어요."; }

    }, () => { sync.live = false; refresh(); });
  } catch { sync.live = false; }
}
// 슬레이브: 질문에 답하면 연결
async function joinWith(join, answer) {
  const key = await Crypt.fromAnswer(answer, join.salt);
  const doc = await Cloud.get(join.id);
  if (!doc) throw new Error("gone");
  try { await Crypt.decrypt(key, doc); } catch { throw new Error("wrong"); }
  data.mode = "partner"; data.partnerLink = { id: join.id, key }; data.partner = null;
  persist(); rebuild(); watchPartner();
}

/* ---------- 알림 (Cloudflare Worker + Web Push) ---------- */
const NOTIFY = window.NOTIFY_CONFIG && window.NOTIFY_CONFIG.workerUrl ? window.NOTIFY_CONFIG : null;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const pushReady = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && !(isIOS() && !isStandalone());

async function api(path, body) {
  const res = await fetch(NOTIFY.workerUrl.replace(/\/$/, "") + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error || "http"), { status: res.status });
  return json;
}
async function ensureChannel() {
  if (!data.notify) { data.notify = { id: randId(18), token: randId(32), claimed: false }; persist(); }
  if (!data.notify.claimed) {
    await api("/claim", { id: data.notify.id, token: data.notify.token });
    data.notify.claimed = true; stamp("notify"); save();
  }
  return data.notify;
}
async function currentSubscription(ask) {
  if (Notification.permission !== "granted") {
    if (!ask) return null;
    if (await Notification.requestPermission() !== "granted") throw new Error("denied");
  }
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription())
    || (ask ? reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64url(NOTIFY.vapidPublicKey) }) : null);
}
async function enablePush(role) {
  const sub = (await currentSubscription(true)).toJSON();
  if (role === "self") {
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role, subscription: sub });
    data.pushSelf = true;
  } else {
    const nid = data.partner && data.partner.notifyId;
    if (!nid) throw new Error("no-channel");
    await api("/subscribe", { id: nid, role, subscription: sub });
    data.pushPartner = nid;
  }
  persist(); scheduleReminders(0);
}
async function disablePush(role) {
  try {
    const sub = await currentSubscription(false);
    const id = role === "self" ? data.notify && data.notify.id : data.pushPartner;
    if (sub && id) await api("/unsubscribe", { id, role, endpoint: sub.endpoint });
    const otherOn = role === "self" ? !!data.pushPartner : !!data.pushSelf;
    if (sub && !otherOn) await sub.unsubscribe();
  } catch {}
  if (role === "self") data.pushSelf = false; else data.pushPartner = null;
  persist();
}
async function rotateChannel() {
  const old = data.notify;
  data.notify = null; stamp("notify"); save();
  if (old && old.claimed) api("/delete", { id: old.id, token: old.token }).catch(() => {});
  if (!data.pushSelf || !NOTIFY) return;
  try {
    const sub = await currentSubscription(false);
    if (!sub) { data.pushSelf = false; persist(); return; }
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role: "self", subscription: sub.toJSON() });
    scheduleReminders(0);
  } catch {}
}
let notifyTimer = null;
function queueUpdateNotify() {
  if (!NOTIFY || !data.myShare || !data.notify || !data.notify.claimed) return;
  data.pendingNotify = true; persist();
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(sendUpdateNotify, 5000);
}
async function sendUpdateNotify() {
  if (!data.pendingNotify || !data.notify || !data.notify.claimed) return;
  try { await api("/notify", { id: data.notify.id, token: data.notify.token }); data.pendingNotify = false; persist(); } catch {}
}
function reminderItems() {
  const t = today(), tk = keyOf(t), items = [];
  if (!engine.runs.length) return items;
  engine.starts.slice(0, 2).forEach(s => items.push({ date: keyOf(addDays(s, -2)), kind: "pre2" }, { date: keyOf(s), kind: "start" }));
  engine.mids.map(o => addDays(o, -5)).filter(d => d >= t).slice(0, 2).forEach(d => items.push({ date: keyOf(d), kind: "zone" }));
  return items.filter(i => i.date >= tk).sort((a, b) => a.date < b.date ? -1 : 1);
}
let reminderTimer = null;
function scheduleReminders(delay = 2000) {
  if (!NOTIFY || !data.notify || !data.notify.claimed) return;
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(pushReminders, delay);
}
async function pushReminders() {
  const items = reminderItems(), fp = JSON.stringify(items);
  if (fp === data.notify.schedFp) return;
  try { await api("/schedule", { id: data.notify.id, token: data.notify.token, items }); data.notify.schedFp = fp; persist(); } catch {}
}
function notifyError(e) {
  if (e.message === "denied") return "알림이 꺼져 있어요. 아이폰 설정 → 알림 → 캘린더에서 허용해 주세요.";
  if (e.message === "no-channel") return `${T.master} 쪽 알림이 아직 준비되지 않았어요.`;
  return "알림을 켜지 못했어요. 인터넷 연결을 확인해 주세요.";
}

// 오늘이 어느 시기인지: 생리 중 > 예정일 1~3일 전(예정일이 지났는데 아직 시작 안 했으면 포함) > 4~7일 전 > 그 외
function phaseOf(e, logs, date = today()) {
  const k = keyOf(date);
  if (isRed(logs[k]) || e.inferred.has(k)) {
    const r = [...e.runs].reverse().find(r => r.start <= date);
    return { key: "small", when: r ? `${T.period} ${diffDays(r.start, date) + 1}일째` : T.periodOn };
  }
  if (!e.runs.length) return { key: "calm", when: "" };
  const next = e.starts.find(x => x >= date), d = next ? diffDays(date, next) : null;
  const last = e.runs[e.runs.length - 1], expected = addDays(last.start, Math.round(e.mu));
  const late = diffDays(expected, date);
  if (late > 0 && date > last.end) return { key: "blue", when: `${T.periodDay}이 ${late}일 지났어요` };
  if (d === 0) return { key: "blue", when: `오늘이 ${T.periodDay}이에요` };
  if (d >= 1 && d <= 3) return { key: "blue", when: `${T.periodDay} ${d}일 전` };
  if (d >= 4 && d <= 7) return { key: "rage", when: `${T.periodDay} ${d}일 전` };
  return { key: "calm", when: d ? `다음 ${T.period}까지 ${d}일` : "" };
}
// 사진 크기: 화면 높이 − (6주짜리 달력 끝 위치) − 아래 홈 바 자리. 달을 넘겨도 크기가 안 바뀌게 항상 6주 기준
let insetProbe = null;
function sizePhase() {
  const card = document.querySelector(".phase"), cal = document.querySelector(".cal");
  if (!card || !cal) return;
  if (!insetProbe) { insetProbe = document.createElement("div"); insetProbe.style.cssText = "position:fixed;visibility:hidden;height:env(safe-area-inset-bottom)"; document.body.appendChild(insetProbe); }
  const cur = cal.querySelector(".panel.cur"), dayH = (cur.querySelector(".day") || {}).offsetHeight || 68;
  const extraRows = 6 - Math.round(cur.offsetHeight / dayH);
  const calBottom = cal.getBoundingClientRect().bottom + window.scrollY + extraRows * dayH;
  const avail = window.innerHeight - calBottom - 16 - insetProbe.offsetHeight - 10;
  document.documentElement.style.setProperty("--phase-size", Math.max(96, Math.min(200, Math.floor(avail))) + "px");
}
window.addEventListener("resize", () => sizePhase());

function phaseCard(e, logs) {
  const ph = phaseOf(e, logs), P = PHASES[ph.key];
  return `<div class="phase"><img src="${P.img}" alt="${esc(P.title)}"${P.pos ? ` style="object-position:${P.pos}"` : ""}>
    <div class="txt"><h2>${esc(P.title)}</h2>
    <p class="desc">${esc(P.desc)}</p></div></div>`;
}

function monthCells(m, e, logs, show, editable) {
  const y = m.getFullYear(), mo = m.getMonth(), t = today();
  let cells = "";
  for (let i = 0; i < new Date(y, mo, 1).getDay(); i++) cells += "<div></div>";
  for (let d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) {
    const date = new Date(y, mo, d), k = keyOf(date), l = logs[k];
    const anniv = show.anniv && annivOf(date);
    const c = ["day"];
    if (isHoliday(date)) c.push("hol");
    if (diffDays(date, t) === 0) c.push("today");
    if (anniv) c.push("anniv");
    const bars = [];
    if (show.period && (isRed(l) || e.inferred.has(k))) bars.push("period");
    else if (show.plan && e.plan.has(k)) bars.push("plan");
    if (show.fertile && e.fertile.has(k)) bars.push("fertile");
    const icons = [];
    if (show.ovul && e.ovul.has(k)) icons.push(`<span class="ic-ovul">${ICON.egg}</span>`);
    if (show.sex && l && l.h) icons.push(`<span class="ic-sex">${ICON.heart}</span>`);
    if (show.shave && l && l.s) icons.push(`<span class="ic-shave">${ICON.bush}</span>`);
    cells += `<button class="${c.join(" ")}" ${editable ? `data-day="${k}"` : "disabled"} aria-label="${mo + 1}월 ${d}일${anniv ? " " + anniv : ""}">`
      + `<span class="n">${anniv ? ICON.heartbg : ""}<span>${d}</span></span>`
      + `<span class="bars">${bars.map(b => `<i class="bar ${b}"></i>`).join("")}</span>`
      + `<span class="icons">${icons.join("")}</span></button>`;
  }
  return cells;
}

function calendarHtml(scope, e, logs, show, editable) {
  const m = state.month[scope], y = m.getFullYear(), mo = m.getMonth();
  const panel = (delta, cls) => `<div class="panel grid${cls}">${monthCells(new Date(y, mo + delta, 1), e, logs, show, editable)}</div>`;
  const lg = [], lgIcon = []; // 위: 막대 범례 / 아래: 아이콘 범례
  if (show.period) lg.push(`<span><i class="lb" style="background:var(--period)"></i>${T.periodOn}</span>`);
  if (show.plan) lg.push(`<span><i class="lb" style="background:var(--plan)"></i>${T.periodPlan}</span>`);
  if (show.fertile) lg.push(`<span><i class="lb" style="background:var(--fertile)"></i>${T.fertile}</span>`);
  if (show.ovul) lgIcon.push(`<span><span class="ic-ovul">${ICON.egg}</span>${T.ovulation}</span>`);
  if (show.sex) lgIcon.push(`<span><span class="ic-sex">${ICON.heart}</span>${T.sex}</span>`);
  if (show.shave) lgIcon.push(`<span><span class="ic-shave">${ICON.bush}</span>${T.shave}</span>`);
  return `<div class="cal" data-scope="${scope}">
    <div class="cal-head"><button data-month="${scope}" data-delta="-1" aria-label="이전 달">${ICON.left}</button>
      <b>${y}년 ${mo + 1}월</b><button data-month="${scope}" data-delta="1" aria-label="다음 달">${ICON.right}</button></div>
    <div class="grid">${WD.map((w, i) => `<div class="wd${i === 0 ? " sun" : ""}">${w}</div>`).join("")}</div>
    <div class="pager"><div class="track">${panel(-1, "")}${panel(0, " cur")}${panel(1, "")}</div></div>
    <div class="legend">${[lg, lgIcon].filter(r => r.length).map(r => `<div class="lg-row">${r.join("")}</div>`).join("")}</div></div>`;
}

function render() {

function refresh() {

  if (pager.drag || pager.sliding) { setTimeout(refresh, 500); return; } // 달 넘기는 중에는 다시 그리지 않음
  if (!$("day").open && !(a && a.tagName === "INPUT" && a.type !== "checkbox")) render();

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return;
  if (pager.justDragged) { pager.justDragged = false; return; } // 밀다가 손 뗀 건 날짜 누른 걸로 치지 않음
  if (el.dataset.month) { slideMonth(el.closest(".cal"), Number(el.dataset.delta)); return; }
  if (el.dataset.day) { openDay(el.dataset.day); return; }
  switch (el.dataset.action) {
    case "gate": {
      const v = $("gate-in").value, join = parseJoin(v), dev = parseDevice(v);
      if (dev) {
        el.disabled = true; el.textContent = "연결 중…";
        try { await joinDevice(dev); state.forceGate = false; state.gateError = ""; if (FORCE_GATE) history.replaceState(null, "", location.pathname); }
        catch (err) { state.gateError = { gone: "없는 링크예요.", denied: `이미 쓴 링크예요. ${T.master} 기기에서 새로 만들어 주세요.`, key: "링크가 잘못됐어요." }[err.message] || "연결하지 못했어요. 인터넷을 확인해 주세요."; }
        render(); return;
      }
      if (join) { state.join = join; state.gateError = ""; render(); return; }
      if (await sha256hex("cal-master:" + norm(v)) === MASTER_HASH) {
        if (data.mode === "partner") { if (sync.unsub) { sync.unsub(); sync.unsub = null; } data.partnerLink = null; data.partner = null; }
        data.mode = "me"; state.forceGate = false; state.gateError = ""; persist(); rebuild();
        if (FORCE_GATE) history.replaceState(null, "", location.pathname);
        render(); catchUp(); return;
      }
      state.gateError = "암호가 맞지 않아요."; render(); return;
    }
    case "join": {
      const answer = $("gate-in").value;
      if (!norm(answer)) return;
      state.busy = true; state.gateError = ""; render();
      try { await joinWith(state.join, answer); state.join = null; }
      catch (err) { state.gateError = err.message === "wrong" ? "답이 맞지 않아요." : err.message === "gone" ? "만료된 초대 링크예요." : "연결하지 못했어요. 인터넷을 확인해 주세요."; }
      state.busy = false; render(); return;
    }
    case "share-create": {
      const q = $("q-in").value.trim(), a = $("a-in").value;
      if (!q || !norm(a)) { alert("질문과 답을 모두 입력해 주세요."); return; }
      if (norm(a).length > 10) { alert("답은 10자 이내로 정해 주세요."); return; }
      state.busy = true; render();
      try { await createShare(q, a); scheduleReminders(0); } catch { alert("초대 링크를 만들지 못했어요. 인터넷 연결을 확인해 주세요."); }
      state.busy = false; render(); return;
    }
    case "share-send": {
      const url = joinLink();
      if (navigator.share) navigator.share({ url }).catch(() => {});
      else navigator.clipboard?.writeText(url).then(() => alert("링크를 복사했어요."), () => prompt("링크를 복사하세요.", url));
      return;
    }
    case "share-stop":
      if (!confirm("연결을 끊을까요? 다시 연결하려면 초대 링크를 새로 만들어야 해요.")) return;
      await stopShare(); render(); return;
    case "device-link":
      state.busy = true; render();
      try { state.deviceLink = await makeDeviceLink(); } catch { alert("링크를 만들지 못했어요. 인터넷 연결을 확인해 주세요."); }
      state.busy = false; render(); return;
    case "device-copy":
      navigator.clipboard?.writeText(state.deviceLink).then(() => alert("링크를 복사했어요."), () => { $("device-url").select(); document.execCommand("copy"); });
      return;
    case "push-partner":
      el.disabled = true;
      try { await enablePush("partner"); } catch (err) { alert(notifyError(err)); }
      render(); return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "gate-in") document.querySelector('[data-action="gate"],[data-action="join"]')?.click();
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset && el.dataset.show) { data.show[el.dataset.show] = el.checked; stamp("show"); save(); return; }
  if (el.dataset && el.dataset.push) {
    const want = el.checked; el.disabled = true;
    try { want ? await enablePush(el.dataset.push) : await disablePush(el.dataset.push); } catch (err) { alert(notifyError(err)); }
    render();
  }
});

function shiftMonth(scope, delta) {
  const m = state.month[scope]; state.month[scope] = new Date(m.getFullYear(), m.getMonth() + delta, 1); render();
}
// 달 넘기기: 미는 동안 손가락을 따라가고, 놓으면 다음 달로 미끄러지거나 제자리로 돌아옴
const pager = { drag: null, sliding: false, justDragged: false };
const trackOf = cal => cal && cal.querySelector(".track");
function setTrack(track, px, animate) {
  track.classList.toggle("anim", !!animate);
  track.style.transform = `translate3d(calc(-33.3333% + ${px}px),0,0)`;
}
function slideMonth(cal, delta) {
  const track = trackOf(cal); if (!track || pager.sliding) return;
  const scope = cal.dataset.scope, pagerEl = cal.querySelector(".pager"), width = pagerEl.clientWidth;
  pager.sliding = true;
  const target = track.children[delta > 0 ? 2 : 0];
  pagerEl.style.height = target.offsetHeight + "px";       // 5주 ↔ 6주 높이도 같이 맞춤
  const m = state.month[scope], next = new Date(m.getFullYear(), m.getMonth() + delta, 1);
  cal.querySelector(".cal-head b").textContent = `${next.getFullYear()}년 ${next.getMonth() + 1}월`;
  void track.offsetWidth; // 지금 위치를 확정한 뒤 애니메이션 시작
  setTrack(track, delta > 0 ? -width : width, true);
  let done = false;
  const finish = () => { if (done) return; done = true; pager.sliding = false; shiftMonth(scope, delta); };
  track.addEventListener("transitionend", ev => { if (ev.propertyName === "transform") finish(); });
  setTimeout(finish, 450);
}
function snapBack(cal) {
  const track = trackOf(cal); if (track) setTrack(track, 0, true);
}
document.addEventListener("pointerdown", e => {
  const pagerEl = e.target.closest(".pager"); if (!pagerEl || pager.sliding || (e.pointerType === "mouse" && e.button !== 0)) return;
  const now = performance.now();
  pager.drag = { cal: pagerEl.closest(".cal"), x: e.clientX, y: e.clientY, lock: null, dx: 0, width: pagerEl.clientWidth, id: e.pointerId, lastX: e.clientX, lastT: now, v: 0 };
});
document.addEventListener("pointermove", e => {
  const d = pager.drag; if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (!d.lock && Math.hypot(dx, dy) > 10) d.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? "x" : "y"; // 확실히 옆으로 밀 때만 달력이 따라옴
  if (d.lock !== "x") return;
  const now = performance.now();
  d.v = (e.clientX - d.lastX) / Math.max(1, now - d.lastT); d.lastX = e.clientX; d.lastT = now;
  d.dx = dx;
  setTrack(trackOf(d.cal), dx, false);
});
function endDrag(e) {
  const d = pager.drag; if (!d || (e && e.pointerId !== d.id)) return;
  pager.drag = null;
  if (d.lock !== "x") return;
  pager.justDragged = true; setTimeout(() => { pager.justDragged = false; }, 60);
  const far = Math.abs(d.dx) > d.width * 0.22, fast = Math.abs(d.v) > 0.45 && Math.abs(d.dx) > 12;
  if (far || fast) slideMonth(d.cal, d.dx < 0 ? 1 : -1); else snapBack(d.cal);
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", e => { const d = pager.drag; if (d && d.lock === "x") snapBack(d.cal); pager.drag = null; });

$("lbl-period").textContent = T.periodOn;
$("lbl-sex").textContent = T.sex;
$("lbl-shave").textContent = T.shave;
function openDay(k) {
  state.dayKey = k;
  const d = dateOf(k), l = data.logs[k], anniv = annivOf(d);
  $("day-title").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  $("day-sub").textContent = anniv ? `${T.anniv} · ${anniv}` : "";
  $("chk-red").checked = isRed(l);
  $("chk-heart").checked = !!(l && l.h);
  $("chk-shave").checked = !!(l && l.s);
  $("day").showModal();
}
function updateDay() {
  const k = state.dayKey;
  const l = { r: $("chk-red").checked, h: $("chk-heart").checked, s: $("chk-shave").checked };
  const redChanged = isRed(data.logs[k]) !== l.r;
  if (l.r || l.h || l.s) data.logs[k] = l; else delete data.logs[k];
  data.meta = { ...(data.meta || {}), [k]: Date.now() };
  save(); render();
  if (redChanged) queueUpdateNotify(); // 생리 기록이 바뀔 때만 슬레이브에게 알림
}
["chk-red", "chk-heart", "chk-shave"].forEach(id => $(id).addEventListener("change", updateDay));
$("day-close").addEventListener("click", () => $("day").close());
$("day").addEventListener("click", e => { if (e.target === $("day")) $("day").close(); });

/* ---------- 시작 ---------- */
function handleHash() {
  const dev = PROFILE ? null : parseDevice(location.hash);
  if (dev) {
    history.replaceState(null, "", location.pathname + location.search);
    if (data.mode === "me" && data.vault && data.vault.id === dev.id) return;
    if (!confirm(`이 기기를 ${T.master} 기기로 추가할까요? 이 기기에 있던 기록은 합쳐져요.`)) return;
    joinDevice(dev).then(render, err => alert(err.message === "denied" ? `이미 쓴 링크예요. ${T.master} 기기에서 새로 만들어 주세요.` : "연결하지 못했어요."));
    return;
  }
  const join = parseJoin(location.hash); if (!join) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (data.mode === "partner" && data.partnerLink && data.partnerLink.id === join.id) return;
  if (data.mode === "me" && !PROFILE) {
    // 마스터 기기가 실수로 슬레이브가 되지 않게
    if (data.myShare && data.myShare.id === join.id) { alert(`${T.master} 기기에서 연 내 초대 링크예요. ${T.slave} 폰에서 열어 주세요.`); return; }
    if (!confirm(`이 기기를 ${T.slave} 화면으로 바꿀까요? 이 기기의 ${T.master} 기록은 지워지지 않아요.`)) return;
  }
  state.join = join; state.gateError = ""; render();
}
window.addEventListener("hashchange", handleHash);
function catchUp() {
  if (data.mode !== "me") return;
  if (!PROFILE) { if (data.vault) { watchVault(); scheduleVault(0); } else ensureVault(); }
  scheduleSync(0);
  if (NOTIFY && data.myShare && !(data.notify && data.notify.claimed)) ensureChannel().catch(() => {});
  scheduleReminders(0);
  if (data.pendingNotify) sendUpdateNotify();
  if (oldShareId && Cloud.configured) { const id = oldShareId; oldShareId = null; Cloud.remove(id).catch(() => {}); persist(); }
}
window.addEventListener("online", () => { catchUp(); if (!sync.live) watchPartner(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { rebuild(); refresh(); catchUp(); } });
{ const q = new URLSearchParams(location.search);
  if (q.has("tab")) { q.delete("tab"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); } }
navigator.serviceWorker?.addEventListener("message", () => { rebuild(); render(); });

rebuild();
render();
window.__rendered = true; window.__reveal && window.__reveal();
handleHash();
catchUp();
watchPartner();
navigator.storage?.persist?.().catch(() => {});
{ const hadSW = !!navigator.serviceWorker?.controller, t0 = Date.now();
  navigator.serviceWorker?.addEventListener("controllerchange", () => { if (hadSW && Date.now() - t0 < 4000 && !$("day").open) location.reload(); }); }
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
</script>
