<html lang="ko">

<style>
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --ink:#1F1D1B; --ink2:#6F6A64; --ink3:#A9A39C; --line:#ECE8E2;
  --period:#D94A5B; --period-soft:#F9E3E6; --fertile-soft:#E3EEE7; --ovul:#3E8A68;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --surface:#1E1C1A; --ink:#F2EFEA; --ink2:#A39D95; --ink3:#6E6962; --line:#2C2926;
  --period:#E2606F; --period-soft:#3B2328; --fertile-soft:#1E2F26; --ovul:#6DBB93;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.5;letter-spacing:-0.01em;
  padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:440px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
svg{display:block}

/* 상단 요약 */
.hero{padding:0 4px}
.hero .label{font-size:15px;font-weight:500;color:var(--ink2)}
.hero .value{font-size:60px;font-weight:700;letter-spacing:-0.045em;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .value small{font-size:24px;font-weight:600;letter-spacing:-0.02em;margin-left:3px}
.hero .value.text{font-size:36px;letter-spacing:-0.035em;margin-top:6px}
.hero .note{font-size:14px;color:var(--ink2);margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1.25fr 1fr;margin:26px 0 18px;padding:0 4px}
.stats>div+div{border-left:1px solid var(--line);padding-left:14px}
.stats .k{font-size:12px;color:var(--ink3)}
.stats .v{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats .v em{font-style:normal;font-weight:500;color:var(--ink3);font-size:12px;margin-left:3px}

/* 캘린더 */
.card{background:var(--surface);border-radius:22px;padding:16px 12px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px 10px}
.cal-head b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:2px}
.nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.nav button:active{background:var(--line)}
.nav svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wd{font-size:12px;font-weight:500;color:var(--ink3);text-align:center;padding:4px 0 6px}
.day{height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.day .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.day .i{height:7px;display:flex;gap:3px;align-items:center}
.day .i svg{width:8px;height:8px;color:var(--period)}
.day .i .dot{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.day.today .n{font-weight:700}
.day.zone .n{background:var(--fertile-soft)}
.day.ovul .n{background:var(--fertile-soft);box-shadow:inset 0 0 0 1.5px var(--ovul)}
.day.plan .n{background:var(--period-soft);color:var(--period)}
.day.period .n{background:var(--period);color:#fff;font-weight:600}
.day:disabled{cursor:default;color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin:6px 6px 0;padding-top:12px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend svg{width:9px;height:9px;color:var(--period)}

/* 설정 목록 */
.group{margin-top:28px}
.group h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 8px 8px}
.list{background:var(--surface);border-radius:18px;padding:0 16px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:62px}
.item+.item{border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:600}
.item .t span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.pill{height:34px;padding:0 15px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;white-space:nowrap}
.textbtn{font-size:14px;font-weight:600;color:var(--period);white-space:nowrap;padding:8px 0}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--period)}
.switch:checked::after{transform:translateX(20px)}
.switch:disabled{opacity:.5}

/* 입력 */
.field{display:flex;gap:8px;margin-top:12px}
.field input{flex:1;min-width:0;height:46px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.field input::placeholder{color:var(--ink3)}
.field .pill{height:46px;padding:0 18px}

/* 처음 화면 · 안내 */
.welcome{padding-top:14vh}
.welcome h1{font-size:32px;font-weight:700;letter-spacing:-0.035em;margin:0}
.welcome p{color:var(--ink2);margin:6px 0 32px}
.welcome .start{height:52px;width:100%;font-size:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px;margin:32px 0 2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{color:var(--ink2);font-size:14px;padding:8px 4px}
.center{text-align:center;margin-top:18px}

/* 날짜 기록 시트 */
dialog{border:0;margin:auto auto 0;width:100%;max-width:480px;background:var(--bg);color:var(--ink);
  border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px)}
dialog[open]{animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
dialog::backdrop{background:rgba(20,18,16,.32)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}
.sheet-head b{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.sheet-head button{font-size:15px;font-weight:600;color:var(--period);padding:6px 0}

<body>
<div class="wrap">
  <div id="view"></div>
</div>

<dialog id="day">
  <div class="grab"></div>
  <div class="sheet-head"><b id="day-title"></b><button id="day-close">완료</button></div>
  <div class="list">
    <label class="item"><span class="t"><b id="lbl-period"></b></span><input type="checkbox" class="switch" id="chk-red"></label>
    <label class="item"><span class="t"><b id="lbl-sex"></b></span><input type="checkbox" class="switch" id="chk-heart"></label>
  </div>
</dialog>

<script src="firebase-config.js"></script>
<script src="notify-config.js"></script>
<script>
"use strict";
/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const md = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const short = d => `${d.getMonth() + 1}/${d.getDate()}`;
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- 저장 (이 기기 안) ---------- */
const STORAGE_KEY = "calendar-v1";
const DEFAULT_GAP = 28, DEFAULT_LEN = 5;
const isRed = l => !!(l && l.r);

function cleanLogs(raw) {
  const out = {};
  for (const [k, v] of Object.entries(raw && typeof raw === "object" ? raw : {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v) continue;
    const l = { r: v.r === true, h: v.h === true };
    if (l.r || l.h) out[k] = l;
  }
  return out;
}
function load() {
  // myShare: 내가 올리는 공유 {id, key, fp}, partnerLink: 내가 보는 파트너 공유 {id, key}
  const base = { logs: {}, partner: null, myShare: null, partnerLink: null };
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return p ? { ...base, ...p, logs: cleanLogs(p.logs) } : base;
  } catch { return base; }
}
let data = load(), engine, partnerEngine;
// 이 기기의 사용 방식: "me" = 내 캘린더, "partner" = 공유받은 캘린더만 보기
if (!data.mode) data.mode = data.partnerLink ? "partner" : (Object.keys(data.logs).length || data.myShare ? "me" : null);

function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} }
function rebuild() {
  engine = makeEngine(data.logs);
  partnerEngine = data.partner ? makeEngine(data.partner.logs) : null;
}
function save() { persist(); rebuild(); scheduleSync(); scheduleReminders(); }

/* ---------- 예측 ----------
   최근 6개 주기 평균으로 다음 생리 예측, 배란일 = 다음 생리 14일 전, 가임기 = 배란일 5일 전 ~ 1일 후 */
function makeEngine(logs, now = today()) {
  const dates = Object.keys(logs).filter(k => isRed(logs[k])).sort().map(dateOf);
  const runs = [];
  for (const d of dates) {
    const last = runs[runs.length - 1];
    if (last && diffDays(last.end, d) <= 2) last.end = d; else runs.push({ start: d, end: d });
  }
  const gaps = runs.slice(1).map((r, i) => diffDays(runs[i].start, r.start)).filter(g => g >= 15 && g <= 60).slice(-6);
  const avgGap = gaps.length ? Math.round(avg(gaps)) : DEFAULT_GAP;
  const done = runs.filter(r => diffDays(r.end, now) >= 2).slice(-6);
  const avgLen = Math.min(14, Math.max(1, done.length ? Math.round(avg(done.map(r => diffDays(r.start, r.end) + 1))) : DEFAULT_LEN));

  const mids = [], starts = [];
  runs.slice(1).forEach((r, i) => { const g = diffDays(runs[i].start, r.start); if (g >= 15 && g <= 60) mids.push(addDays(r.start, -14)); });
  let expected = null;
  if (runs.length) {
    expected = addDays(runs[runs.length - 1].start, avgGap);
    mids.push(addDays(expected, -14));
    let s = expected < now ? now : expected;
    for (let i = 0; i < 6; i++) { starts.push(s); s = addDays(s, avgGap); }
    starts.slice(1).forEach(s => mids.push(addDays(s, -14)));
  }
  mids.sort((a, b) => a - b);
  const plan = new Set(), zone = new Set(), mid = new Set();
  starts.forEach(s => { for (let j = 0; j < avgLen; j++) plan.add(keyOf(addDays(s, j))); });
  mids.forEach(o => { mid.add(keyOf(o)); for (let j = -5; j <= 1; j++) zone.add(keyOf(addDays(o, j))); });
  const last = runs[runs.length - 1];
  const runAt = d => runs.find(r => d >= r.start && d <= r.end);

  return {
    runs, avgGap, usesDefault: !gaps.length, plan, zone, mid, starts, mids,
    phase(d) {
      if (!runs.length) return { type: "none" };
      const r = runAt(d);
      if (r) return { type: "red", n: diffDays(r.start, d) + 1 };
      if (d > expected && d > last.end) return { type: "late", n: diffDays(expected, d) };
      if (mid.has(keyOf(d))) return { type: "mid" };
      if (zone.has(keyOf(d))) return { type: "zone" };
      return { type: "regular" };
    },
    dayCount(d) { const r = [...runs].reverse().find(r => r.start <= d); return r ? diffDays(r.start, d) + 1 : null; },
    nextStart(d) {
      if (last && d >= last.start && d <= last.end) return starts.find(s => s > last.end);
      return starts.find(s => s >= d);
    },
    zoneWindow(d) { const o = mids.find(o => addDays(o, 1) >= d); return o && { start: addDays(o, -5), end: addDays(o, 1) }; }
  };
}

/* ---------- 실시간 공유 (Firebase) ----------
   서버에는 폰에서 암호화한 데이터만 올라감. 열쇠는 공유 링크의 # 뒤에만 있어서 서버는 내용을 볼 수 없음 */
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const Cloud = {
  configured: !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId),
  _p: null,
  load() {
    if (!this.configured) return Promise.reject(new Error("not-configured"));
    return this._p ||= (async () => {
      const [{ initializeApp }, fs, au] = await Promise.all([
        import(SDK + "firebase-app.js"), import(SDK + "firebase-firestore.js"), import(SDK + "firebase-auth.js")]);
      const { useEmulator, ...cfg } = window.FIREBASE_CONFIG;
      const app = initializeApp(cfg), db = fs.getFirestore(app), auth = au.getAuth(app);
      if (useEmulator) {
        fs.connectFirestoreEmulator(db, "127.0.0.1", 8080);
        au.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
      }
      return { fs, au, db, auth };
    })().catch(e => { this._p = null; throw e; });
  },
  async uid() {
    const { au, auth } = await this.load();
    await auth.authStateReady();
    if (!auth.currentUser) await au.signInAnonymously(auth); // 익명 로그인: 내 공유만 내가 고칠 수 있게
    return auth.currentUser.uid;
  },
  async put(id, payload) {
    const { fs, db } = await this.load();
    await fs.setDoc(fs.doc(db, "shares", id), { owner: await this.uid(), v: 1, ...payload, updatedAt: fs.serverTimestamp() });
  },
  async remove(id) { const { fs, db } = await this.load(); await this.uid(); await fs.deleteDoc(fs.doc(db, "shares", id)); },
  async watch(id, onData, onError) {
    const { fs, db } = await this.load();
    return fs.onSnapshot(fs.doc(db, "shares", id), s => onData(s.exists() ? s.data() : null), onError);
  }
};

const b64url = bytes => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64url = str => Uint8Array.from(atob(str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4)), c => c.charCodeAt(0));
const Crypt = {
  async newKey() {
    const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    return b64url(new Uint8Array(await crypto.subtle.exportKey("raw", k)));
  },
  key: k => crypto.subtle.importKey("raw", unb64url(k), "AES-GCM", false, ["encrypt", "decrypt"]),
  async encrypt(k, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(k), new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64url(iv), ct: b64url(new Uint8Array(ct)) };
  },
  async decrypt(k, { iv, ct }) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64url(iv) }, await this.key(k), unb64url(ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

const shareLink = () => data.myShare && `${location.origin}${location.pathname}#s=${data.myShare.id}.${data.myShare.key}`;
// notifyId: 파트너가 내 알림을 구독할 때 쓰는 채널 ID (암호화된 공유 데이터 안에만 들어감)
const snapshot = () => ({ format: "cal", version: 1, kind: "share", name: "", exportedAt: isoNow(), logs: data.logs,
  gap: DEFAULT_GAP, len: DEFAULT_LEN, notifyId: data.notify && data.notify.claimed ? data.notify.id : null });
const shareFp = () => JSON.stringify([data.logs, data.notify && data.notify.claimed ? data.notify.id : null]);
const sync = { timer: null, unsub: null, live: false, gone: false, error: "" };

function scheduleSync(delay = 800) {
  if (!data.myShare || !Cloud.configured) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushShare, delay);
}
async function pushShare() {
  const share = data.myShare; if (!share) return;
  const fp = shareFp();
  if (fp === share.fp) return; // 바뀐 게 없으면 올리지 않음
  try {
    await Cloud.put(share.id, await Crypt.encrypt(share.key, snapshot()));
    share.fp = fp; share.at = isoNow(); sync.error = ""; persist();
  } catch (e) {
    sync.error = e.code === "permission-denied" ? "이 기기에서 공유를 수정할 권한이 없어요. 공유를 중지하고 새 링크를 만들어 주세요." : "인터넷 연결 후 자동으로 올려요.";
  }
  refresh();
}
async function createShare() {
  const id = b64url(crypto.getRandomValues(new Uint8Array(15))), key = await Crypt.newKey();
  await Cloud.put(id, await Crypt.encrypt(key, snapshot()));
  data.myShare = { id, key, fp: shareFp(), at: isoNow() };
  persist();
}
async function watchPartner() {
  if (sync.unsub) { sync.unsub(); sync.unsub = null; }
  sync.live = false; sync.gone = false;
  const link = data.partnerLink;
  if (!link || !Cloud.configured) return;
  try {
    sync.unsub = await Cloud.watch(link.id, async doc => {
      if (!doc) { sync.gone = true; refresh(); return; }
      try {
        const snap = await Crypt.decrypt(link.key, doc);
        data.partner = { exportedAt: String(snap.exportedAt || ""), logs: cleanLogs(snap.logs),
                         notifyId: typeof snap.notifyId === "string" && /^[A-Za-z0-9_-]{16,64}$/.test(snap.notifyId) ? snap.notifyId : null };
        sync.live = true; sync.gone = false; persist(); rebuild();
      } catch { sync.error = "파트너 데이터를 열지 못했어요. 링크를 다시 받아 주세요."; }
      refresh();
    }, () => { sync.live = false; refresh(); });
  } catch { sync.live = false; }
}
function parseLink(text) {
  const m = String(text || "").match(/#s=([A-Za-z0-9_-]{10,})\.([A-Za-z0-9_-]{40,})/);
  return m && { id: m[1], key: m[2] };
}
function connectPartner(link) {
  data.partnerLink = link; data.partner = null; persist(); rebuild(); watchPartner();
}

/* ---------- 알림 (Cloudflare Worker + Web Push) ----------
   - 내 채널(data.notify): 내가 주인. 파트너 구독 + 내 예정일 알림 구독이 여기 붙음
   - 생리 기록이 바뀌면 /notify (파트너에게만, 서버가 10분에 1번으로 제한)
   - 예정일 알림 날짜는 내 폰이 계산해서 /schedule 로 보냄 (날짜와 종류만) */
const NOTIFY = window.NOTIFY_CONFIG && window.NOTIFY_CONFIG.workerUrl ? window.NOTIFY_CONFIG : null;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const pushReady = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && !(isIOS() && !isStandalone());
const randId = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function api(path, body) {
  const res = await fetch(NOTIFY.workerUrl.replace(/\/$/, "") + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error || "http"), { status: res.status });
  return json;
}

async function ensureChannel() {
  if (!data.notify) { data.notify = { id: randId(18), token: randId(32), claimed: false }; persist(); }
  if (!data.notify.claimed) {
    await api("/claim", { id: data.notify.id, token: data.notify.token });
    data.notify.claimed = true; persist();
    scheduleSync(0); // 공유 데이터에 채널 ID를 넣어 파트너에게 전달
  }
  return data.notify;
}

async function currentSubscription(ask) {
  if (Notification.permission !== "granted") {
    if (!ask) return null;
    if (await Notification.requestPermission() !== "granted") throw new Error("denied");
  }
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription())
    || (ask ? reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64url(NOTIFY.vapidPublicKey) }) : null);
}

async function enablePush(role) {
  const sub = (await currentSubscription(true)).toJSON(); // 권한 요청은 버튼을 누른 직후에 해야 해서 맨 먼저
  if (role === "self") {
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role, subscription: sub });
    data.pushSelf = true;
  } else {
    const nid = data.partner && data.partner.notifyId;
    if (!nid) throw new Error("no-channel");
    await api("/subscribe", { id: nid, role, subscription: sub });
    data.pushPartner = nid;
  }
  persist();
  scheduleReminders(0);
}

async function disablePush(role) {
  try {
    const sub = await currentSubscription(false);
    const id = role === "self" ? data.notify && data.notify.id : data.pushPartner;
    if (sub && id) await api("/unsubscribe", { id, role, endpoint: sub.endpoint });
    const otherOn = role === "self" ? !!data.pushPartner : !!data.pushSelf;
    if (sub && !otherOn) await sub.unsubscribe();
  } catch {}
  if (role === "self") data.pushSelf = false; else data.pushPartner = null;
  persist();
}

// 공유를 중지하면 채널을 새로 만들어 기존 파트너 구독을 끊음 (내 예정일 알림은 유지)
async function rotateChannel() {
  const old = data.notify;
  data.notify = null; persist();
  if (old && old.claimed) api("/delete", { id: old.id, token: old.token }).catch(() => {});
  if (!data.pushSelf || !NOTIFY) return;
  try {
    const sub = await currentSubscription(false);
    if (!sub) { data.pushSelf = false; persist(); return; }
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role: "self", subscription: sub.toJSON() });
    scheduleReminders(0);
  } catch {}
}

let notifyTimer = null;
function queueUpdateNotify() {
  if (!NOTIFY || !data.myShare || !data.notify || !data.notify.claimed) return;
  data.pendingNotify = true; persist();
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(sendUpdateNotify, 5000); // 연달아 체크하면 마지막 체크 5초 뒤 한 번
}
async function sendUpdateNotify() {
  if (!data.pendingNotify || !data.notify || !data.notify.claimed) return;
  try { await api("/notify", { id: data.notify.id, token: data.notify.token }); data.pendingNotify = false; persist(); } catch {}
}

function reminderItems() {
  const t = today(), tk = keyOf(t), items = [];
  if (!engine.runs.length) return items;
  engine.starts.slice(0, 2).forEach(s => {
    items.push({ date: keyOf(addDays(s, -2)), kind: "pre2" }, { date: keyOf(s), kind: "start" });
  });
  engine.mids.map(o => addDays(o, -5)).filter(d => d >= t).slice(0, 2)
    .forEach(d => items.push({ date: keyOf(d), kind: "zone" }));
  return items.filter(i => i.date >= tk).sort((a, b) => a.date < b.date ? -1 : 1);
}
let reminderTimer = null;
function scheduleReminders(delay = 2000) {
  if (!NOTIFY || !data.notify || !data.notify.claimed) return;
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(pushReminders, delay);
}
async function pushReminders() {
  const items = reminderItems(), fp = JSON.stringify(items);
  if (fp === data.notify.schedFp) return;
  try { await api("/schedule", { id: data.notify.id, token: data.notify.token, items }); data.notify.schedFp = fp; persist(); } catch {}
}

function notifyError(e) {
  if (e.message === "denied") return "알림이 꺼져 있어요. 아이폰 설정 → 알림 → 캘린더에서 허용해 주세요.";
  if (e.message === "no-channel") return "파트너 쪽 알림 기능이 아직 준비되지 않았어요. 잠시 후 다시 시도해 주세요.";
  return "알림을 켜지 못했어요. 인터넷 연결을 확인해 주세요.";
}

/* ---------- 화면에 나오는 말 ----------
   둘만의 용어로 바꿀 땐 여기만 고치면 돼요. (알림 문구는 worker/src/index.js 의 MESSAGES) */
const T = {
  period: "생리",          // 다음 생리, 생리까지
  periodOn: "생리 중",     // 날짜 기록 스위치
  periodPlan: "생리 예정", // 캘린더 범례, 생리 예정일
  sex: "관계",             // 날짜 기록 스위치, 범례
  fertile: "가임기",
  ovulation: "배란일",
  cycle: "주기"
};

/* ---------- 화면 ---------- */
const state = { month: { me: today(), partner: today() }, dayKey: null };
const $ = id => document.getElementById(id);
const dot = d => `${d.getMonth() + 1}.${d.getDate()}`;
const ICON = {
  left: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  right: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2s-7.6-4.7-9.6-9.4C1 8.4 3.2 4.8 6.8 4.8c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.6 0 5.8 3.6 4.4 7-2 4.7-9.6 9.4-9.6 9.4z"/></svg>`
};

function heroHtml(e) {
  const t = today(), ph = e.phase(t);
  if (ph.type === "none") return `<div class="hero"><div class="value text">첫 기록을 남겨 주세요</div>
    <div class="note">날짜를 눌러 기록하면 예측을 시작해요.</div></div>`;
  const next = e.nextStart(t), w = e.zoneWindow(t), nd = next ? diffDays(t, next) : null;
  let label, value, unit = "", text = false;
  switch (ph.type) {
    case "red": label = T.periodOn; value = ph.n; unit = "일째"; break;
    case "late": label = "예정일보다"; value = ph.n; unit = "일 늦어요"; break;
    case "mid": label = "오늘은"; value = T.ovulation; text = true; break;
    case "zone": label = "지금은"; value = T.fertile; text = true; break;
    default:
      if (nd === 0) { label = "오늘은"; value = `${T.periodPlan}일`; text = true; }
      else { label = `${T.period}까지`; value = nd; unit = "일"; }
  }
  const stats = [
    [`다음 ${T.period}`, next ? `${next.getMonth() + 1}월 ${next.getDate()}일` : "–"],
    [T.fertile, w ? `${dot(w.start)} – ${dot(w.end)}` : "–"],
    [`평균 ${T.cycle}`, `${e.avgGap}일${e.usesDefault ? "<em>기본</em>" : ""}`]
  ];
  return `<div class="hero"><div class="label">${label}</div>
      <div class="value${text ? " text" : ""}">${value}${unit ? `<small>${unit}</small>` : ""}</div>
      <div class="note">${T.cycle} ${e.dayCount(t)}일째</div></div>
    <div class="stats">${stats.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
}

function calendarHtml(scope, e, logs, editable) {
  const m = state.month[scope], y = m.getFullYear(), mo = m.getMonth(), t = today();
  let cells = WD.map(w => `<div class="wd">${w}</div>`).join("");
  for (let i = 0; i < new Date(y, mo, 1).getDay(); i++) cells += "<div></div>";
  for (let d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) {
    const date = new Date(y, mo, d), k = keyOf(date), l = logs[k], isToday = diffDays(date, t) === 0;
    const c = ["day"];
    if (isRed(l)) c.push("period");
    else if (e.plan.has(k)) c.push("plan");
    else if (e.mid.has(k)) c.push("ovul");
    else if (e.zone.has(k)) c.push("zone");
    if (isToday) c.push("today");
    const marks = (isToday ? `<span class="dot"></span>` : "") + (l && l.h ? ICON.heart : "");
    cells += `<button class="${c.join(" ")}" ${editable ? `data-day="${k}"` : "disabled"} aria-label="${mo + 1}월 ${d}일"><span class="n">${d}</span><span class="i">${marks}</span></button>`;
  }
  return `<div class="card">
    <div class="cal-head"><b>${y}년 ${mo + 1}월</b>
      <div class="nav"><button data-month="${scope}" data-delta="-1" aria-label="이전 달">${ICON.left}</button><button data-month="${scope}" data-delta="1" aria-label="다음 달">${ICON.right}</button></div></div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--period)"></i>${T.period}</span>
      <span><i style="background:var(--period-soft)"></i>${T.periodPlan}</span>
      <span><i style="background:var(--fertile-soft)"></i>${T.fertile}</span>
      <span><i style="background:var(--fertile-soft);box-shadow:inset 0 0 0 1.5px var(--ovul)"></i>${T.ovulation}</span>
      <span>${ICON.heart}${T.sex}</span>
    </div></div>`;
}

function meView() {
  return heroHtml(engine) + calendarHtml("me", engine, data.logs, true) + shareGroup() + notifyGroup();
}

function shareGroup() {
  if (!Cloud.configured) return "";
  const items = !data.myShare
    ? `<div class="item"><div class="t"><b>공유 링크</b><span>파트너가 실시간으로 볼 수 있어요</span></div><button class="pill" data-action="share-create">만들기</button></div>`
    : `<div class="item"><div class="t"><b>공유 중</b><span>${sync.error || "기록하면 파트너 화면에 바로 반영돼요"}</span></div><button class="pill" data-action="share-send">링크 보내기</button></div>
       <div class="item"><div class="t"><b>공유 중지</b><span>파트너가 더 이상 볼 수 없어요</span></div><button class="textbtn" data-action="share-stop">중지</button></div>`;
  return `<div class="group"><h2>파트너</h2><div class="list">${items}</div></div>`;
}

function notifyGroup() {
  if (!NOTIFY) return "";
  const ready = pushReady();
  const desc = ready ? `오전 9시에 ${T.period}·${T.fertile} 일정을 알려 드려요` : "홈 화면에 추가한 앱에서 켤 수 있어요";
  return `<div class="group"><h2>알림</h2><div class="list"><label class="item"><span class="t"><b>예정일 알림</b><span>${desc}</span></span>
    ${ready ? `<input type="checkbox" class="switch" data-push="self" ${data.pushSelf ? "checked" : ""}>` : ""}</label></div></div>`;
}

// 처음 여는 화면: 어떻게 쓸지 고르기
function welcomeView() {
  return `<div class="welcome"><h1>캘린더</h1><p>이 기기에서 어떻게 쓸지 골라 주세요.</p>
    <button class="pill start" data-action="mode-me">내 캘린더 시작하기</button>
    <div class="or">또는 받은 공유 링크로 보기</div>${linkInput()}</div>`;
}
const linkInput = () => `<div class="field"><input type="text" id="link-in" placeholder="공유 링크 붙여넣기" autocomplete="off"><button class="pill" data-action="connect">연결</button></div>`;

// 파트너 화면: 공유받은 캘린더만 (알림은 켜기 전까지만 버튼 하나 표시)
function partnerView() {
  if (!Cloud.configured) return `<p class="msg">설정이 필요해요.</p>`;
  if (!data.partnerLink || sync.gone) return `<p class="msg">${sync.gone ? "공유가 중지됐어요. 새 링크를 받았다면 붙여 넣어 주세요." : "받은 공유 링크를 붙여 넣어 주세요."}</p>${linkInput()}`;
  if (!partnerEngine) return `<p class="msg">불러오는 중…</p>`;
  const nid = data.partner.notifyId;
  const askPush = NOTIFY && nid && pushReady() && data.pushPartner !== nid;
  return calendarHtml("partner", partnerEngine, data.partner.logs, false)
    + (askPush ? `<div class="center"><button class="textbtn" data-action="push-partner" data-on="0">알림 받기</button></div>` : "");
}

function render() {
  $("view").innerHTML = data.mode === "me" ? meView() : data.mode === "partner" ? partnerView() : welcomeView();
}
// 입력 중일 때는 화면을 다시 그리지 않음
function refresh() { if (!$("day").open && document.activeElement?.id !== "link-in") render(); }

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.dataset.month) { const s = el.dataset.month, m = state.month[s]; state.month[s] = new Date(m.getFullYear(), m.getMonth() + Number(el.dataset.delta), 1); render(); return; }
  if (el.dataset.day) { openDay(el.dataset.day); return; }
  switch (el.dataset.action) {
    case "share-create":
      el.disabled = true; el.textContent = "만드는 중…";
      if (NOTIFY) await ensureChannel().catch(() => {}); // 알림 채널 ID를 공유 데이터에 함께 넣기 위해 먼저
      try { await createShare(); scheduleReminders(0); } catch { alert("공유 링크를 만들지 못했어요. 인터넷 연결과 Firebase 설정을 확인해 주세요."); }
      render(); break;
    case "push-self":
    case "push-partner": {
      const role = el.dataset.action === "push-self" ? "self" : "partner";
      el.disabled = true;
      try { el.dataset.on === "1" ? await disablePush(role) : await enablePush(role); }
      catch (err) { alert(notifyError(err)); }
      render(); break;
    }
    case "share-send": {
      const url = shareLink();
      if (navigator.share) navigator.share({ url }).catch(() => {});
      else navigator.clipboard?.writeText(url).then(() => alert("링크를 복사했어요."), () => prompt("링크를 복사하세요.", url));
      break;
    }
    case "share-stop":
      if (!confirm("공유를 중지할까요? 파트너는 더 이상 내 캘린더를 볼 수 없어요.")) return;
      try { await Cloud.remove(data.myShare.id); } catch {}
      data.myShare = null; data.pendingNotify = false; persist();
      await rotateChannel();
      render(); break;
    case "connect": {
      const link = parseLink($("link-in").value);
      if (!link) { alert("공유 링크가 아니에요. 링크 전체를 붙여 넣어 주세요."); return; }
      data.mode = "partner"; connectPartner(link); render(); break;
    }
    case "mode-me": {
      data.mode = "me"; persist(); render(); break;
    }
  }
});

// 알림 스위치
document.addEventListener("change", async e => {
  const el = e.target; if (!el.dataset || !el.dataset.push) return;
  const want = el.checked; el.disabled = true;
  try { want ? await enablePush(el.dataset.push) : await disablePush(el.dataset.push); }
  catch (err) { alert(notifyError(err)); }
  render();
});

$("lbl-period").textContent = T.periodOn;
$("lbl-sex").textContent = T.sex;
function openDay(k) {
  state.dayKey = k;
  const d = dateOf(k), l = data.logs[k];
  $("day-title").textContent = `${md(d)} (${WD[d.getDay()]})`;
  $("chk-red").checked = isRed(l);
  $("chk-heart").checked = !!(l && l.h);
  $("day").showModal();
}
function updateDay() {
  const k = state.dayKey;
  const l = { r: $("chk-red").checked, h: $("chk-heart").checked };
  const redChanged = isRed(data.logs[k]) !== l.r;
  if (l.r || l.h) data.logs[k] = l; else delete data.logs[k];
  save(); render();
  if (redChanged) queueUpdateNotify(); // ♥만 바뀌면 알림 안 보냄
}
$("chk-red").addEventListener("change", updateDay);
$("chk-heart").addEventListener("change", updateDay);
$("day-close").addEventListener("click", () => $("day").close());
$("day").addEventListener("click", e => { if (e.target === $("day")) $("day").close(); });

/* ---------- 시작 ---------- */
function handleHash() {
  const link = parseLink(location.hash); if (!link) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (data.partnerLink && data.partnerLink.id === link.id && data.mode === "partner") return;
  const msg = data.mode === "me" ? "이 기기를 파트너 캘린더 보기용으로 바꿀까요? 이 기기의 내 기록은 지워지지 않지만 화면에는 안 보여요." : "파트너 캘린더를 연결할까요?";
  if (confirm(msg)) { data.mode = "partner"; connectPartner(link); render(); }
}
window.addEventListener("hashchange", handleHash);
function catchUp() {
  scheduleSync(0);
  if (NOTIFY && data.myShare && !(data.notify && data.notify.claimed)) ensureChannel().catch(() => {});
  scheduleReminders(0);
  if (data.pendingNotify) sendUpdateNotify();
}
window.addEventListener("online", () => { catchUp(); if (!sync.live) watchPartner(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  rebuild(); refresh(); catchUp();
});
// 알림을 눌러 열었을 때 해당 탭으로
if (new URLSearchParams(location.search).has("tab")) history.replaceState(null, "", location.pathname + location.hash);
navigator.serviceWorker?.addEventListener("message", e => {
  if (e.data && e.data.tab) { rebuild(); render(); }
});

rebuild();
render();
handleHash();
catchUp();
watchPartner();
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
