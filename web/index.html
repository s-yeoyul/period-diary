<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}

.head button{border:0;font-size:20px;padding:4px 12px}

.wd{font-size:12px;color:var(--sub);padding:4px 0}

.day .n{width:34px;height:34px;line-height:30px;border-radius:50%;border:2px solid transparent;font-size:15px}
.day .h{font-size:9px;line-height:10px;height:10px;color:var(--red)}
.day.today .n{font-weight:800;text-decoration:underline}

dialog::backdrop{background:rgba(0,0,0,.3)}

<script src="firebase-config.js"></script>
<script src="notify-config.js"></script>
<script>
"use strict";
/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const md = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const short = d => `${d.getMonth() + 1}/${d.getDate()}`;
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- 저장 (이 기기 안) ---------- */
const STORAGE_KEY = "calendar-v1";
const DEFAULT_GAP = 28, DEFAULT_LEN = 5;
const isRed = l => !!(l && l.r);

function cleanLogs(raw) {
  const out = {};
  for (const [k, v] of Object.entries(raw && typeof raw === "object" ? raw : {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v) continue;
    const l = { r: v.r === true, h: v.h === true };
    if (l.r || l.h) out[k] = l;
  }
  return out;
}
function load() {
  // myShare: 내가 올리는 공유 {id, key, fp}, partnerLink: 내가 보는 파트너 공유 {id, key}
  const base = { logs: {}, partner: null, myShare: null, partnerLink: null };
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return p ? { ...base, ...p, logs: cleanLogs(p.logs) } : base;
  } catch { return base; }
}
let data = load(), engine, partnerEngine;

function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} }
function rebuild() {
  engine = makeEngine(data.logs);
  partnerEngine = data.partner ? makeEngine(data.partner.logs) : null;
}
function save() { persist(); rebuild(); scheduleSync(); scheduleReminders(); }

/* ---------- 예측 ----------
   최근 6개 주기 평균으로 다음 생리 예측, 배란일 = 다음 생리 14일 전, 가임기 = 배란일 5일 전 ~ 1일 후 */
function makeEngine(logs, now = today()) {
  const dates = Object.keys(logs).filter(k => isRed(logs[k])).sort().map(dateOf);
  const runs = [];
  for (const d of dates) {
    const last = runs[runs.length - 1];
    if (last && diffDays(last.end, d) <= 2) last.end = d; else runs.push({ start: d, end: d });
  }
  const gaps = runs.slice(1).map((r, i) => diffDays(runs[i].start, r.start)).filter(g => g >= 15 && g <= 60).slice(-6);
  const avgGap = gaps.length ? Math.round(avg(gaps)) : DEFAULT_GAP;
  const done = runs.filter(r => diffDays(r.end, now) >= 2).slice(-6);
  const avgLen = Math.min(14, Math.max(1, done.length ? Math.round(avg(done.map(r => diffDays(r.start, r.end) + 1))) : DEFAULT_LEN));

  const mids = [], starts = [];
  runs.slice(1).forEach((r, i) => { const g = diffDays(runs[i].start, r.start); if (g >= 15 && g <= 60) mids.push(addDays(r.start, -14)); });
  let expected = null;
  if (runs.length) {
    expected = addDays(runs[runs.length - 1].start, avgGap);
    mids.push(addDays(expected, -14));
    let s = expected < now ? now : expected;
    for (let i = 0; i < 6; i++) { starts.push(s); s = addDays(s, avgGap); }
    starts.slice(1).forEach(s => mids.push(addDays(s, -14)));
  }
  mids.sort((a, b) => a - b);
  const plan = new Set(), zone = new Set(), mid = new Set();
  starts.forEach(s => { for (let j = 0; j < avgLen; j++) plan.add(keyOf(addDays(s, j))); });
  mids.forEach(o => { mid.add(keyOf(o)); for (let j = -5; j <= 1; j++) zone.add(keyOf(addDays(o, j))); });
  const last = runs[runs.length - 1];
  const runAt = d => runs.find(r => d >= r.start && d <= r.end);

  return {
    runs, avgGap, usesDefault: !gaps.length, plan, zone, mid, starts, mids,
    phase(d) {
      if (!runs.length) return { type: "none" };
      const r = runAt(d);
      if (r) return { type: "red", n: diffDays(r.start, d) + 1 };
      if (d > expected && d > last.end) return { type: "late", n: diffDays(expected, d) };
      if (mid.has(keyOf(d))) return { type: "mid" };
      if (zone.has(keyOf(d))) return { type: "zone" };
      return { type: "regular" };
    },
    dayCount(d) { const r = [...runs].reverse().find(r => r.start <= d); return r ? diffDays(r.start, d) + 1 : null; },
    nextStart(d) {
      if (last && d >= last.start && d <= last.end) return starts.find(s => s > last.end);
      return starts.find(s => s >= d);
    },
    zoneWindow(d) { const o = mids.find(o => addDays(o, 1) >= d); return o && { start: addDays(o, -5), end: addDays(o, 1) }; }
  };
}

/* ---------- 실시간 공유 (Firebase) ----------
   서버에는 폰에서 암호화한 데이터만 올라감. 열쇠는 공유 링크의 # 뒤에만 있어서 서버는 내용을 볼 수 없음 */
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
const Cloud = {
  configured: !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId),
  _p: null,
  load() {
    if (!this.configured) return Promise.reject(new Error("not-configured"));
    return this._p ||= (async () => {
      const [{ initializeApp }, fs, au] = await Promise.all([
        import(SDK + "firebase-app.js"), import(SDK + "firebase-firestore.js"), import(SDK + "firebase-auth.js")]);
      const { useEmulator, ...cfg } = window.FIREBASE_CONFIG;
      const app = initializeApp(cfg), db = fs.getFirestore(app), auth = au.getAuth(app);
      if (useEmulator) {
        fs.connectFirestoreEmulator(db, "127.0.0.1", 8080);
        au.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
      }
      return { fs, au, db, auth };
    })().catch(e => { this._p = null; throw e; });
  },
  async uid() {
    const { au, auth } = await this.load();
    await auth.authStateReady();
    if (!auth.currentUser) await au.signInAnonymously(auth); // 익명 로그인: 내 공유만 내가 고칠 수 있게
    return auth.currentUser.uid;
  },
  async put(id, payload) {
    const { fs, db } = await this.load();
    await fs.setDoc(fs.doc(db, "shares", id), { owner: await this.uid(), v: 1, ...payload, updatedAt: fs.serverTimestamp() });
  },
  async remove(id) { const { fs, db } = await this.load(); await this.uid(); await fs.deleteDoc(fs.doc(db, "shares", id)); },
  async watch(id, onData, onError) {
    const { fs, db } = await this.load();
    return fs.onSnapshot(fs.doc(db, "shares", id), s => onData(s.exists() ? s.data() : null), onError);
  }
};

const b64url = bytes => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64url = str => Uint8Array.from(atob(str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4)), c => c.charCodeAt(0));
const Crypt = {
  async newKey() {
    const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    return b64url(new Uint8Array(await crypto.subtle.exportKey("raw", k)));
  },
  key: k => crypto.subtle.importKey("raw", unb64url(k), "AES-GCM", false, ["encrypt", "decrypt"]),
  async encrypt(k, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(k), new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64url(iv), ct: b64url(new Uint8Array(ct)) };
  },
  async decrypt(k, { iv, ct }) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64url(iv) }, await this.key(k), unb64url(ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
};

const shareLink = () => data.myShare && `${location.origin}${location.pathname}#s=${data.myShare.id}.${data.myShare.key}`;
// notifyId: 파트너가 내 알림을 구독할 때 쓰는 채널 ID (암호화된 공유 데이터 안에만 들어감)
const snapshot = () => ({ format: "cal", version: 1, kind: "share", name: "", exportedAt: isoNow(), logs: data.logs,
  gap: DEFAULT_GAP, len: DEFAULT_LEN, notifyId: data.notify && data.notify.claimed ? data.notify.id : null });
const shareFp = () => JSON.stringify([data.logs, data.notify && data.notify.claimed ? data.notify.id : null]);
const sync = { timer: null, unsub: null, live: false, gone: false, error: "" };

function scheduleSync(delay = 800) {
  if (!data.myShare || !Cloud.configured) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushShare, delay);
}
async function pushShare() {
  const share = data.myShare; if (!share) return;
  const fp = shareFp();
  if (fp === share.fp) return; // 바뀐 게 없으면 올리지 않음
  try {
    await Cloud.put(share.id, await Crypt.encrypt(share.key, snapshot()));
    share.fp = fp; share.at = isoNow(); sync.error = ""; persist();
  } catch (e) {
    sync.error = e.code === "permission-denied" ? "이 기기에서 공유를 수정할 권한이 없어요. 공유를 중지하고 새 링크를 만들어 주세요." : "인터넷 연결 후 자동으로 올려요.";
  }
  refresh();
}
async function createShare() {
  const id = b64url(crypto.getRandomValues(new Uint8Array(15))), key = await Crypt.newKey();
  await Cloud.put(id, await Crypt.encrypt(key, snapshot()));
  data.myShare = { id, key, fp: shareFp(), at: isoNow() };
  persist();
}
async function watchPartner() {
  if (sync.unsub) { sync.unsub(); sync.unsub = null; }
  sync.live = false; sync.gone = false;
  const link = data.partnerLink;
  if (!link || !Cloud.configured) return;
  try {
    sync.unsub = await Cloud.watch(link.id, async doc => {
      if (!doc) { sync.gone = true; refresh(); return; }
      try {
        const snap = await Crypt.decrypt(link.key, doc);
        data.partner = { exportedAt: String(snap.exportedAt || ""), logs: cleanLogs(snap.logs),
                         notifyId: typeof snap.notifyId === "string" && /^[A-Za-z0-9_-]{16,64}$/.test(snap.notifyId) ? snap.notifyId : null };
        sync.live = true; sync.gone = false; persist(); rebuild();
      } catch { sync.error = "파트너 데이터를 열지 못했어요. 링크를 다시 받아 주세요."; }
      refresh();
    }, () => { sync.live = false; refresh(); });
  } catch { sync.live = false; }
}
function parseLink(text) {
  const m = String(text || "").match(/#s=([A-Za-z0-9_-]{10,})\.([A-Za-z0-9_-]{40,})/);
  return m && { id: m[1], key: m[2] };
}
function connectPartner(link) {
  data.partnerLink = link; data.partner = null; persist(); rebuild(); watchPartner();
}

/* ---------- 알림 (Cloudflare Worker + Web Push) ----------
   - 내 채널(data.notify): 내가 주인. 파트너 구독 + 내 예정일 알림 구독이 여기 붙음
   - 생리 기록이 바뀌면 /notify (파트너에게만, 서버가 10분에 1번으로 제한)
   - 예정일 알림 날짜는 내 폰이 계산해서 /schedule 로 보냄 (날짜와 종류만) */
const NOTIFY = window.NOTIFY_CONFIG && window.NOTIFY_CONFIG.workerUrl ? window.NOTIFY_CONFIG : null;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const pushReady = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && !(isIOS() && !isStandalone());
const randId = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function api(path, body) {
  const res = await fetch(NOTIFY.workerUrl.replace(/\/$/, "") + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error || "http"), { status: res.status });
  return json;
}

async function ensureChannel() {
  if (!data.notify) { data.notify = { id: randId(18), token: randId(32), claimed: false }; persist(); }
  if (!data.notify.claimed) {
    await api("/claim", { id: data.notify.id, token: data.notify.token });
    data.notify.claimed = true; persist();
    scheduleSync(0); // 공유 데이터에 채널 ID를 넣어 파트너에게 전달
  }
  return data.notify;
}

async function currentSubscription(ask) {
  if (Notification.permission !== "granted") {
    if (!ask) return null;
    if (await Notification.requestPermission() !== "granted") throw new Error("denied");
  }
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription())
    || (ask ? reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64url(NOTIFY.vapidPublicKey) }) : null);
}

async function enablePush(role) {
  const sub = (await currentSubscription(true)).toJSON(); // 권한 요청은 버튼을 누른 직후에 해야 해서 맨 먼저
  if (role === "self") {
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role, subscription: sub });
    data.pushSelf = true;
  } else {
    const nid = data.partner && data.partner.notifyId;
    if (!nid) throw new Error("no-channel");
    await api("/subscribe", { id: nid, role, subscription: sub });
    data.pushPartner = nid;
  }
  persist();
  scheduleReminders(0);
}

async function disablePush(role) {
  try {
    const sub = await currentSubscription(false);
    const id = role === "self" ? data.notify && data.notify.id : data.pushPartner;
    if (sub && id) await api("/unsubscribe", { id, role, endpoint: sub.endpoint });
    const otherOn = role === "self" ? !!data.pushPartner : !!data.pushSelf;
    if (sub && !otherOn) await sub.unsubscribe();
  } catch {}
  if (role === "self") data.pushSelf = false; else data.pushPartner = null;
  persist();
}

// 공유를 중지하면 채널을 새로 만들어 기존 파트너 구독을 끊음 (내 예정일 알림은 유지)
async function rotateChannel() {
  const old = data.notify;
  data.notify = null; persist();
  if (old && old.claimed) api("/delete", { id: old.id, token: old.token }).catch(() => {});
  if (!data.pushSelf || !NOTIFY) return;
  try {
    const sub = await currentSubscription(false);
    if (!sub) { data.pushSelf = false; persist(); return; }
    const ch = await ensureChannel();
    await api("/subscribe", { id: ch.id, token: ch.token, role: "self", subscription: sub.toJSON() });
    scheduleReminders(0);
  } catch {}
}

let notifyTimer = null;
function queueUpdateNotify() {
  if (!NOTIFY || !data.myShare || !data.notify || !data.notify.claimed) return;
  data.pendingNotify = true; persist();
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(sendUpdateNotify, 5000); // 연달아 체크하면 마지막 체크 5초 뒤 한 번
}
async function sendUpdateNotify() {
  if (!data.pendingNotify || !data.notify || !data.notify.claimed) return;
  try { await api("/notify", { id: data.notify.id, token: data.notify.token }); data.pendingNotify = false; persist(); } catch {}
}

function reminderItems() {
  const t = today(), tk = keyOf(t), items = [];
  if (!engine.runs.length) return items;
  engine.starts.slice(0, 2).forEach(s => {
    items.push({ date: keyOf(addDays(s, -2)), kind: "pre2" }, { date: keyOf(s), kind: "start" });
  });
  engine.mids.map(o => addDays(o, -5)).filter(d => d >= t).slice(0, 2)
    .forEach(d => items.push({ date: keyOf(d), kind: "zone" }));
  return items.filter(i => i.date >= tk).sort((a, b) => a.date < b.date ? -1 : 1);
}
let reminderTimer = null;
function scheduleReminders(delay = 2000) {
  if (!NOTIFY || !data.notify || !data.notify.claimed) return;
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(pushReminders, delay);
}
async function pushReminders() {
  const items = reminderItems(), fp = JSON.stringify(items);
  if (fp === data.notify.schedFp) return;
  try { await api("/schedule", { id: data.notify.id, token: data.notify.token, items }); data.notify.schedFp = fp; persist(); } catch {}
}

function notifyError(e) {
  if (e.message === "denied") return "알림이 꺼져 있어요. 아이폰 설정 → 알림 → 캘린더에서 허용해 주세요.";
  if (e.message === "no-channel") return "파트너 쪽 알림 기능이 아직 준비되지 않았어요. 잠시 후 다시 시도해 주세요.";
  return "알림을 켜지 못했어요. 인터넷 연결을 확인해 주세요.";
}

/* ---------- 화면 ---------- */
const state = { view: "me", month: { me: today(), partner: today() }, dayKey: null };
const $ = id => document.getElementById(id);

function statusHtml(e) {
  const t = today(), ph = e.phase(t);
  if (ph.type === "none") return `<p class="status">생리한 날을 눌러 기록하세요</p><p class="sub">기록이 쌓이면 다음 생리일과 가임기를 계산해요.</p>`;
  const next = e.nextStart(t), w = e.zoneWindow(t);
  const head = { red: `생리 ${ph.n}일째`, late: `생리 예정일보다 ${ph.n}일 늦음`, mid: "오늘 배란 예정일", zone: "가임기",
                 regular: next ? (diffDays(t, next) === 0 ? "오늘 생리 예정일" : `생리까지 ${diffDays(t, next)}일`) : "" }[ph.type];
  const parts = [`주기 ${e.dayCount(t)}일째`];
  if (next) parts.push(`다음 생리 ${md(next)}`);
  if (w) parts.push(`가임기 ${short(w.start)}~${short(w.end)}`);
  parts.push(`평균 주기 ${e.avgGap}일${e.usesDefault ? "(기본값)" : ""}`);
  return `<p class="status">${head}</p><p class="sub">${parts.join(" · ")}</p>`;
}

function calendarHtml(scope, e, logs, editable) {
  const m = state.month[scope], y = m.getFullYear(), mo = m.getMonth(), t = today();
  let cells = WD.map(w => `<div class="wd">${w}</div>`).join("");
  for (let i = 0; i < new Date(y, mo, 1).getDay(); i++) cells += "<div></div>";
  for (let d = 1; d <= new Date(y, mo + 1, 0).getDate(); d++) {
    const date = new Date(y, mo, d), k = keyOf(date), l = logs[k];
    const c = ["day"];
    if (isRed(l)) c.push("red");
    else if (e.plan.has(k)) c.push("plan");
    else if (e.mid.has(k)) c.push("mid");
    else if (e.zone.has(k)) c.push("zone");
    if (diffDays(date, t) === 0) c.push("today");
    cells += `<button class="${c.join(" ")}" ${editable ? `data-day="${k}"` : "disabled"}><span class="n">${d}</span><span class="h">${l && l.h ? "♥" : ""}</span></button>`;
  }
  return `<div class="head"><button data-month="${scope}" data-delta="-1">‹</button><b>${y}년 ${mo + 1}월</b><button data-month="${scope}" data-delta="1">›</button></div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--red)"></i>생리</span><span><i style="border:2px dashed var(--red)"></i>생리 예정</span>
    <span><i style="background:var(--zone)"></i>가임기</span><span><i style="border:2px solid var(--mid)"></i>배란일</span><span style="color:var(--red)">♥ 관계</span></div>`;
}

function meView() {
  let share;
  if (!Cloud.configured) share = `<p class="sub">파트너 공유를 쓰려면 firebase-config.js 설정이 필요해요.</p>`;
  else if (!data.myShare) share = `<p class="sub">링크를 받은 파트너는 내 캘린더를 실시간으로 볼 수 있어요.</p><div class="row"><button data-action="share-create">공유 링크 만들기</button></div>`;
  else share = `<p class="sub">공유 중 · 기록을 바꾸면 파트너 화면에 자동 반영돼요.${sync.error ? `<br>${sync.error}` : ""}</p>
    <div class="row"><input type="text" id="share-url" readonly value="${shareLink()}"><button data-action="share-send">보내기</button></div>
    <button class="danger" data-action="share-stop">공유 중지</button>`;
  return statusHtml(engine) + calendarHtml("me", engine, data.logs, true)
    + `<section><h2>파트너와 공유</h2>${share}</section>`
    + (NOTIFY ? `<section><h2>내 예정일 알림</h2>${notifyBody("self")}</section>` : "")
    + partnerSection();
}

// 파트너 연결 · 파트너 알림 · 연결 끊기는 내 캘린더 탭 아래에 둠 (파트너 탭은 캘린더만)
function partnerSection() {
  if (!Cloud.configured) return "";
  if (!data.partnerLink) return `<section><h2>파트너 캘린더</h2><p class="sub">파트너가 보낸 공유 링크를 붙여 넣으면 '파트너' 탭에서 볼 수 있어요.</p>
    <div class="row"><input type="text" id="link-in" placeholder="https://…#s=…"><button data-action="connect">연결</button></div></section>`;
  const info = sync.gone ? "파트너가 공유를 중지했어요."
    : sync.error ? sync.error
    : !data.partner ? "불러오는 중…"
    : `${sync.live ? "실시간 연결됨" : "오프라인 · 마지막으로 받은 내용"} · ${fmtTime(data.partner.exportedAt)} 업데이트`;
  return `<section><h2>파트너 캘린더</h2><p class="sub">${info}</p>`
    + (NOTIFY && data.partner && !sync.gone ? notifyBody("partner") : "")
    + `<button class="danger" data-action="disconnect">연결 끊기</button></section>`;
}

function notifyBody(role) {
  const desc = role === "self" ? "생리 예정 2일 전 · 생리 예정일 · 가임기 시작일 오전 9시에 알려 드려요."
                               : "파트너가 생리 기록을 바꾸거나 파트너의 생리 예정일·가임기가 다가오면 알려 드려요.";
  if (!pushReady()) return `<p class="sub">${desc}<br>홈 화면에 추가한 앱에서 켤 수 있어요 (iOS 16.4 이상).</p>`;
  if (role === "partner" && !(data.partner && data.partner.notifyId)) return `<p class="sub">파트너 쪽에서 알림 기능이 아직 준비되지 않았어요.</p>`;
  const on = role === "self" ? !!data.pushSelf : !!data.pushPartner && data.pushPartner === data.partner.notifyId;
  const label = role === "self" ? (on ? "알림 끄기" : "알림 받기") : (on ? "파트너 알림 끄기" : "파트너 알림 받기");
  return `<p class="sub">${desc}</p><div class="row"><button data-action="push-${role}" data-on="${on ? 1 : 0}">${label}</button></div>`;
}

// 파트너 탭: 캘린더만
function partnerView() {
  if (data.partnerLink && partnerEngine && !sync.gone) return calendarHtml("partner", partnerEngine, data.partner.logs, false);
  const msg = !Cloud.configured || !data.partnerLink ? "내 캘린더 탭 아래 '파트너 캘린더'에서 공유 링크를 연결하세요."
    : sync.gone ? "파트너가 공유를 중지했어요." : "불러오는 중…";
  return `<p class="sub">${msg}</p>`;
}

function render() {
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
  $("view").innerHTML = state.view === "me" ? meView() : partnerView();
}
// 입력 중일 때는 화면을 다시 그리지 않음
function refresh() { if (!$("day").open && document.activeElement?.id !== "link-in") render(); }

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return;
  if (el.dataset.view) { state.view = el.dataset.view; render(); return; }
  if (el.dataset.month) { const s = el.dataset.month, m = state.month[s]; state.month[s] = new Date(m.getFullYear(), m.getMonth() + Number(el.dataset.delta), 1); render(); return; }
  if (el.dataset.day) { openDay(el.dataset.day); return; }
  switch (el.dataset.action) {
    case "share-create":
      el.disabled = true; el.textContent = "만드는 중…";
      if (NOTIFY) await ensureChannel().catch(() => {}); // 알림 채널 ID를 공유 데이터에 함께 넣기 위해 먼저
      try { await createShare(); scheduleReminders(0); } catch { alert("공유 링크를 만들지 못했어요. 인터넷 연결과 Firebase 설정을 확인해 주세요."); }
      render(); break;
    case "push-self":
    case "push-partner": {
      const role = el.dataset.action === "push-self" ? "self" : "partner";
      el.disabled = true;
      try { el.dataset.on === "1" ? await disablePush(role) : await enablePush(role); }
      catch (err) { alert(notifyError(err)); }
      render(); break;
    }
    case "share-send": {
      const url = shareLink();
      if (navigator.share) navigator.share({ url }).catch(() => {});
      else { $("share-url").select(); navigator.clipboard?.writeText(url).then(() => alert("링크를 복사했어요."), () => document.execCommand("copy")); }
      break;
    }
    case "share-stop":
      if (!confirm("공유를 중지할까요? 파트너는 더 이상 내 캘린더를 볼 수 없어요.")) return;
      try { await Cloud.remove(data.myShare.id); } catch {}
      data.myShare = null; data.pendingNotify = false; persist();
      await rotateChannel();
      render(); break;
    case "connect": {
      const link = parseLink($("link-in").value);
      if (!link) { alert("공유 링크가 아니에요. 링크 전체를 붙여 넣어 주세요."); return; }
      connectPartner(link); state.view = "partner"; render(); break;
    }
    case "disconnect":
      if (!confirm("파트너 캘린더 연결을 끊을까요?")) return;
      if (data.pushPartner) await disablePush("partner");
      data.partnerLink = null; data.partner = null; persist(); rebuild(); watchPartner(); render(); break;
  }
});

function openDay(k) {
  state.dayKey = k;
  const d = dateOf(k), l = data.logs[k];
  $("day-title").textContent = `${md(d)} (${WD[d.getDay()]})`;
  $("chk-red").checked = isRed(l);
  $("chk-heart").checked = !!(l && l.h);
  $("day").showModal();
}
function updateDay() {
  const k = state.dayKey;
  const l = { r: $("chk-red").checked, h: $("chk-heart").checked };
  const redChanged = isRed(data.logs[k]) !== l.r;
  if (l.r || l.h) data.logs[k] = l; else delete data.logs[k];
  save(); render();
  if (redChanged) queueUpdateNotify(); // ♥만 바뀌면 알림 안 보냄
}
$("chk-red").addEventListener("change", updateDay);
$("chk-heart").addEventListener("change", updateDay);
$("day-close").addEventListener("click", () => $("day").close());
$("day").addEventListener("click", e => { if (e.target === $("day")) $("day").close(); });

/* ---------- 시작 ---------- */
function handleHash() {
  const link = parseLink(location.hash); if (!link) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (data.partnerLink && data.partnerLink.id === link.id) { state.view = "partner"; render(); return; }
  if (confirm("파트너 캘린더를 연결할까요?")) { connectPartner(link); state.view = "partner"; render(); }
}
window.addEventListener("hashchange", handleHash);
function catchUp() {
  scheduleSync(0);
  if (NOTIFY && data.myShare && !(data.notify && data.notify.claimed)) ensureChannel().catch(() => {});
  scheduleReminders(0);
  if (data.pendingNotify) sendUpdateNotify();
}
window.addEventListener("online", () => { catchUp(); if (!sync.live) watchPartner(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  rebuild(); refresh(); catchUp();
});
// 알림을 눌러 열었을 때 해당 탭으로
const tabParam = new URLSearchParams(location.search).get("tab");
if (tabParam === "partner" || tabParam === "me") { state.view = tabParam; history.replaceState(null, "", location.pathname + location.hash); }
navigator.serviceWorker?.addEventListener("message", e => {
  if (e.data && (e.data.tab === "partner" || e.data.tab === "me")) { state.view = e.data.tab; render(); }
});

rebuild();
render();
handleHash();
catchUp();
watchPartner();
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
